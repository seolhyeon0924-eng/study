<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<script>try{var t=localStorage.getItem("mb.theme");if(t!=="dark"&&t!=="light")t="dark";document.documentElement.dataset.theme=t}catch(e){document.documentElement.dataset.theme="dark"}</script>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B0A1E">
<title>마음별 심리검사</title>
<meta name="description" content="성격, 관계, 자아상태, 문장완성, 그림검사까지 — 마음별 무료 심리검사와 온라인 해석 상담">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="common.css">
<style>
/* ==================================================================
   index 전용 — 처음 화면, 검사, 내 결과, 게시판, 보고서
   ================================================================== */
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
.wrap.narrow{max-width:920px}
@media (max-width:760px){.wrap{padding-left:20px;padding-right:20px}}
#view{outline:none;padding-top:56px}
body.is-home #view,body.is-test #view{padding-top:0}
body.is-test #view > .wrap:first-child{padding-top:32px}
.fade{animation:fade .3s ease both}
@keyframes fade{from{opacity:0}to{opacity:1}}
.center{text-align:center}
.note{color:var(--ink2);font-size:15px}
.help{color:var(--mute);font-size:13.5px}
.err{color:var(--warn);font-size:14.5px;font-weight:600}
.err:empty{display:none}
.mute{color:var(--mute)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.cite{font-size:13px;color:var(--mute);line-height:1.65}
.hp{position:absolute;left:-9999px;width:1px;height:1px;opacity:0}
.crumb,.shead{display:none}
.empty,.fempty{display:flex;flex-direction:column;align-items:center;gap:14px;padding:56px 20px;background:var(--bg2);border-radius:var(--r-m);color:var(--mute);text-align:center}
.sec-t{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}
.sec-t h2{font-size:30px;font-weight:800;letter-spacing:-.055em}
.sec-t p{color:var(--mute);margin-top:4px;font-size:15px}
.more-lnk{display:inline-flex;align-items:center;gap:4px;flex:none;font-size:15px;font-weight:700;color:var(--green);text-decoration:none}
:root[data-theme="dark"] .more-lnk{color:var(--tone-ink)}
.more-lnk svg{width:14px;height:14px}
@media (hover:hover){.more-lnk:hover{text-decoration:underline;text-underline-offset:4px}}
@media (max-width:560px){.sec-t h2{font-size:24px}}

/* ---------- 폼 ---------- */
.form{display:flex;flex-direction:column;gap:22px}
.f{display:flex;flex-direction:column;gap:8px}
.f label,legend{font-weight:700;font-size:15.5px}
fieldset{border:0;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;min-width:0}
legend{padding:0;margin-bottom:10px}
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=search],input[type=date],input:not([type]),select,textarea{width:100%;height:52px;border:1.5px solid var(--line);border-radius:var(--r-s);background:var(--paper);padding:0 16px;font-size:16px;color:var(--ink)}
textarea{height:auto;min-height:130px;padding:14px 16px;resize:vertical;line-height:1.7}
input:focus,select:focus,textarea:focus{border-color:var(--green);outline:none;box-shadow:0 0 0 4px color-mix(in srgb,var(--green) 16%,transparent)}
input::placeholder,textarea::placeholder{color:var(--mute)}
input:disabled,textarea:disabled{background:var(--bg2)}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:inline-flex;align-items:center;height:44px;padding:0 18px;border:1.5px solid var(--line);background:var(--paper);font-size:15px;font-weight:600;cursor:pointer;border-radius:999px}
.seg input:checked + span{background:var(--green);border-color:var(--green);color:#fff}
.seg input:focus-visible + span{outline:2px solid var(--green);outline-offset:2px}
.opts{display:grid;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:16px 18px;border:1.5px solid var(--line);cursor:pointer;border-radius:var(--r-m);background:var(--paper)}
.opt input{margin:4px 0 0;width:18px;height:18px;accent-color:var(--green);flex:none}
.opt b{display:block}
.opt small{display:block;color:var(--mute);font-size:14px}
.opt:has(input:checked){border-color:var(--green);background:var(--soft)}
.check{display:flex;gap:10px;align-items:flex-start;font-size:15px;cursor:pointer}
.check input{width:20px;height:20px;accent-color:var(--green);margin:3px 0 0;flex:none}
.check b{color:var(--green)}
.terms{max-height:230px;overflow:auto;background:var(--bg2);border-radius:var(--r-m);padding:18px 22px;font-size:14.5px;color:var(--ink2)}
.terms h4{font-size:15px;color:var(--ink);margin:12px 0 4px}
.terms h4:first-child{margin-top:0}
.terms ul{margin:0;padding-left:18px}
.box{background:var(--bg2);border-radius:var(--r-l);padding:28px}
.setup-note{background:color-mix(in srgb,var(--gold) 16%,var(--paper));border-radius:var(--r-s);padding:12px 16px;font-size:14.5px}

/* ---------- 모달 · 알림 ---------- */
.modal{position:fixed;inset:0;z-index:200;background:rgba(10,20,16,.5);display:grid;place-items:center;padding:20px}
.modal-box{position:relative;width:min(420px,100%);background:var(--paper);border-radius:var(--r-l);padding:34px 28px 28px;display:flex;flex-direction:column;gap:12px}
.modal-box h2{font-size:22px;font-weight:800}
.modal-x{position:absolute;right:12px;top:10px;width:40px;height:40px;border:0;background:none;font-size:28px;line-height:1;color:var(--ink2);border-radius:50%}
.toast{position:fixed;left:50%;bottom:calc(28px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);background:var(--ink);color:var(--paper);padding:12px 20px;border-radius:999px;font-size:14.5px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:220;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ==================================================================
   처음 화면
   ================================================================== */
.hero{background:var(--soft);padding:72px 0 0;text-align:center;overflow:hidden}
.hero-note{display:inline-flex;align-items:center;gap:10px;max-width:calc(100% - 40px);height:38px;padding:0 16px 0 6px;border-radius:999px;background:var(--paper);color:var(--ink2);text-decoration:none;font-size:14px;margin-bottom:26px}
.hero-note b{flex:none;height:28px;padding:0 10px;border-radius:999px;background:var(--green);color:#fff;display:inline-grid;place-items:center;font-size:12.5px}
.hero-note span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.hero-note:hover span{text-decoration:underline;text-underline-offset:3px}}
.hero h1{font-size:clamp(36px,5.6vw,64px);line-height:1.18;letter-spacing:-.065em;font-weight:800;color:var(--ink)}
.hero-sub{font-size:18px;color:var(--ink2);margin:18px auto 0;max-width:30em;line-height:1.7;padding:0 20px}
.chips{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin:38px auto 0;max-width:900px;padding:0 20px}
.chips button{height:56px;padding:0 24px;border-radius:999px;background:var(--paper);border:1.5px solid var(--line);font-size:16.5px;font-weight:700;letter-spacing:-.035em;color:var(--ink);transition:background-color .15s,border-color .15s,color .15s}
@media (hover:hover){.chips button:hover{border-color:var(--green)}}
.chips button[aria-pressed="true"]{background:var(--deep);border-color:var(--deep);color:#fff}
:root[data-theme="dark"] .chips button[aria-pressed="true"]{background:var(--green);border-color:var(--green)}
.picked{max-width:900px;margin:44px auto 0;background:var(--paper);border-radius:32px 32px 0 0;padding:34px 40px 36px;text-align:left;display:grid;grid-template-columns:96px minmax(0,1fr) auto;gap:24px 28px;align-items:center}
.picked .plate{width:96px;border-radius:24px}
.picked small{color:var(--green);font-weight:800;font-size:14px}
:root[data-theme="dark"] .picked small{color:var(--tone-ink)}
.picked h2{font-size:28px;letter-spacing:-.055em;margin:2px 0 6px;font-weight:800}
.picked p{color:var(--ink2);font-size:15.5px;line-height:1.7;max-width:34em}
.picked .row{flex-direction:column;align-items:stretch;gap:8px}
@media (max-width:760px){.hero{padding-top:48px}.chips button{height:48px;padding:0 18px;font-size:15px}.picked{grid-template-columns:64px minmax(0,1fr);padding:28px 22px 30px;margin-top:32px;border-radius:26px 26px 0 0}.picked .plate{width:64px;border-radius:18px}.picked .row{grid-column:1/-1;flex-direction:row}.picked .row .btn{flex:1}.picked h2{font-size:23px}}
.hsec{padding-top:100px}
@media (max-width:760px){.hsec{padding-top:72px}}

/* 검사 카드 */
.tgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px}
@media (max-width:980px){.tgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:600px){.tgrid{grid-template-columns:1fr;gap:14px}}
.tcard{position:relative;display:flex;flex-direction:column;gap:8px;padding:26px 26px 24px;border-radius:var(--r-l);background:var(--paper);border:1.5px solid var(--line);color:inherit;text-decoration:none;transition:border-color .15s,transform .15s}
@media (hover:hover){a.tcard:hover{border-color:var(--green)}a.tcard:hover b{text-decoration:underline;text-underline-offset:4px}}
.tc-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.tcard .plate{width:56px;border-radius:16px}
.tc-topic{font-size:13px;font-weight:700;color:var(--mute)}
.tcard b{font-size:20px;font-weight:800;letter-spacing:-.045em}
.tcard p{font-size:15px;color:var(--ink2);line-height:1.65}
.tc-meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:12px}
.tc-meta span{height:28px;padding:0 11px;border-radius:999px;background:var(--bg2);font-size:13px;font-weight:600;color:var(--ink2);display:inline-flex;align-items:center}
.tc-meta .done{background:var(--soft);color:var(--green)}
.tc-meta .wait{background:color-mix(in srgb,var(--gold) 20%,var(--paper));color:#7A5410}
:root[data-theme="dark"] .tc-meta .done{color:var(--tone-ink)}
:root[data-theme="dark"] .tc-meta .wait{color:#F0CC82}
.tcard.soon{background:var(--bg2);border-style:dashed}
.tcard.soon b{color:var(--ink2)}
.pill{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:var(--bg2);color:var(--ink2)}
.pill.ok{background:var(--soft);color:var(--green)}
.pill.wait{background:color-mix(in srgb,var(--gold) 20%,var(--paper));color:#7A5410}

/* 이야기 구역 */
.story{display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:48px}
@media (max-width:980px){.story{grid-template-columns:1fr;gap:64px}}
.qa-mini{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.qa-mini a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:2px 12px;padding:16px 18px;border-radius:var(--r-m);background:var(--bg2);color:var(--ink);text-decoration:none}
.qa-mini .qm{grid-row:1/3;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:grid;place-items:center;font-weight:800;font-size:14px}
.qa-mini b{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qa-mini small{color:var(--mute);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (hover:hover){.qa-mini a:hover b{text-decoration:underline;text-underline-offset:3px}}
.qa-mini .msg{padding:28px 18px;color:var(--mute);background:var(--bg2);border-radius:var(--r-m)}
.ask-cta{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:10px;padding:20px 22px;border-radius:var(--r-m);background:var(--soft)}
.ask-cta b{display:block;font-size:17px}
.ask-cta p{font-size:14.5px;color:var(--ink2)}

/* 상담 안내 */
.cband{background:var(--deep);color:#fff;border-radius:34px;padding:56px 56px;display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:48px;align-items:center}
:root[data-theme="dark"] .cband{background:#1C3A33}
.cband h2{font-size:clamp(26px,3.2vw,36px);font-weight:800;letter-spacing:-.055em;color:#fff}
.cband > div > p{opacity:.85;margin-top:12px}
.cband .row{margin-top:26px}
.cband .btn-w{background:#fff;color:var(--deep)}
.cband .btn-g{background:transparent;color:#fff;border-color:rgba(255,255,255,.45)}
.cband .crisis-l{margin-top:20px;font-size:14px;opacity:.85}
.cband .crisis-l b{color:var(--gold)}
.csteps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:1fr 1fr;gap:12px;counter-reset:s}
.csteps li{counter-increment:s;background:rgba(255,255,255,.08);border-radius:var(--r-m);padding:20px 20px 18px}
.csteps li::before{content:counter(s);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--gold);color:#3A2A05;font-weight:800;font-size:14px;margin-bottom:10px}
.csteps b{display:block;font-size:17px}
.csteps span{font-size:14px;opacity:.82}
@media (max-width:900px){.cband{grid-template-columns:1fr;padding:40px 26px;border-radius:28px}}

/* ==================================================================
   내 결과
   ================================================================== */
.res-list{display:flex;flex-direction:column;gap:12px}
.res{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:18px;align-items:center;padding:22px 24px;border-radius:var(--r-l);border:1.5px solid var(--line);background:var(--paper)}
.res .plate{width:64px;border-radius:18px}
.res b{font-size:19px;font-weight:800;letter-spacing:-.04em}
.res p{color:var(--ink2);font-size:15px}
.res small{color:var(--mute);font-size:13.5px}
.res .row{justify-content:flex-end}
@media (max-width:700px){.res{grid-template-columns:52px minmax(0,1fr);padding:20px}.res .plate{width:52px}.res .row{grid-column:1/-1;justify-content:stretch}.res .row .btn{flex:1}}
.res-h{font-size:18px;font-weight:800;margin:40px 0 14px}
.res-h:first-child{margin-top:0}

/* ==================================================================
   게시판
   ================================================================== */
.bd-top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.bd-count{font-size:15px;color:var(--ink2)}
.bd-count b{color:var(--green);font-weight:800}
:root[data-theme="dark"] .bd-count b{color:var(--tone-ink)}
.bd-cats{display:flex;flex-wrap:wrap;gap:6px}
.bd-cats button{height:38px;padding:0 16px;border:1.5px solid var(--line);background:var(--paper);font-size:14.5px;font-weight:600;color:var(--ink2);border-radius:999px}
.bd-cats button[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.bd{width:100%;border-collapse:collapse;font-size:16px}
.bd thead{display:none}
.bd tr{display:flex;align-items:center;gap:16px;padding:20px 8px;border-bottom:1px solid var(--line)}
.bd tbody tr:first-child{border-top:1px solid var(--line)}
.bd td{padding:0;color:var(--ink2);font-size:14.5px}
.bd .c-no{display:none}
.bd .c-no:has(.bd-pin){display:block}
.bd .c-cat{flex:none;min-width:56px}
.bd .c-cat{font-weight:700;color:var(--green)}
:root[data-theme="dark"] .bd .c-cat{color:var(--tone-ink)}
.bd .c-tit{flex:1;min-width:0}
.bd .c-tit a{color:var(--ink);text-decoration:none;font-weight:600;font-size:17px}
@media (hover:hover){.bd .c-tit a:hover{text-decoration:underline;text-underline-offset:4px}}
.bd .c-date{flex:none;color:var(--mute);font-variant-numeric:tabular-nums}
.bd tr.pinned{background:var(--bg2);border-radius:var(--r-s)}
.bd-pin{display:inline-flex;align-items:center;height:24px;padding:0 9px;border-radius:999px;background:var(--gold);color:#3A2A05;font-size:12px;font-weight:800}
.bd .new{display:inline-grid;place-items:center;width:18px;height:18px;margin-left:6px;border-radius:50%;background:var(--gold);color:#3A2A05;font-size:10px;font-weight:800;vertical-align:2px}
.bd td[colspan]{flex:1;text-align:center}
@media (max-width:600px){.bd tr{flex-wrap:wrap;gap:4px 10px}.bd .c-tit{order:3;flex-basis:100%}.bd .c-date{margin-left:auto}}
.pg-nav{display:flex;justify-content:center;gap:6px;margin-top:32px}
.pg-nav button{min-width:40px;height:40px;border:0;border-radius:50%;background:var(--bg2);font-size:14.5px;font-weight:600;color:var(--ink2)}
.pg-nav button[aria-current="true"]{background:var(--green);color:#fff}

/* 글 보기 */
.bv{background:var(--paper)}
.bv-h{padding:0 0 24px;border-bottom:1px solid var(--line)}
.bv-cat{display:inline-flex;align-items:center;height:28px;padding:0 12px;border-radius:999px;background:var(--soft);color:var(--green);font-weight:700;font-size:13.5px}
:root[data-theme="dark"] .bv-cat{color:var(--tone-ink)}
.bv-h h2{font-size:clamp(24px,3vw,32px);font-weight:800;letter-spacing:-.05em;margin-top:12px}
.bv-meta{display:flex;flex-wrap:wrap;gap:4px 16px;margin:12px 0 0;font-size:14px;color:var(--mute)}
.bv-meta div{display:flex;gap:6px}
.bv-meta dt{font-weight:600}
.bv-meta dd{margin:0}
.bv-mood{display:inline-flex;align-items:center;height:26px;margin-left:10px;padding:0 10px;border-radius:999px;font-size:12.5px;font-weight:700;background:color-mix(in srgb,var(--mc) 40%,var(--paper));color:var(--ink);vertical-align:4px}
.bv-body{padding:34px 0 40px;min-height:200px;font-size:17px;line-height:1.95;white-space:pre-wrap}
.bv-photo{margin:0 0 28px}
.bv-photo img{display:block;max-width:100%;max-height:640px;border-radius:var(--r-m)}
.bv-acts{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;padding:0 0 24px;border-bottom:1px solid var(--line)}
.bv-nav{list-style:none;margin:0;padding:0}
.bv-nav li{display:grid;grid-template-columns:90px minmax(0,1fr);gap:12px;padding:16px 4px;border-bottom:1px solid var(--line)}
.bv-nav span{font-weight:700;font-size:14px;color:var(--mute)}
.bv-nav a,.bv-nav em{color:var(--ink);text-decoration:none;font-style:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bv-nav em{color:var(--mute)}
@media (hover:hover){.bv-nav a:hover{text-decoration:underline;text-underline-offset:3px}}
.bv-list{text-align:center;margin-top:36px}
.bv-list .btn{min-width:140px}

/* 오늘의 기록 */
.owner-bar{display:flex;align-items:center;gap:16px;padding:22px 24px;border-radius:var(--r-l);background:var(--bg2);margin-bottom:36px}
.owner-bar .ava{flex:none;width:52px;height:52px;border-radius:50%;background:var(--green);display:grid;place-items:center}
.owner-bar .ava svg{width:26px;height:26px}
.owner-bar b{display:block;font-size:17px}
.owner-bar p{color:var(--ink2);font-size:14.5px}
.gal{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:36px 20px}
.gal.two{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (max-width:900px){.gal{grid-template-columns:repeat(2,minmax(0,1fr));gap:28px 14px}}
.gal-i{display:flex;flex-direction:column;color:inherit;text-decoration:none}
.gal-img{display:block;aspect-ratio:4/3;overflow:hidden;background:var(--bg2);border-radius:var(--r-l)}
.gal-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .4s}
@media (hover:hover){.gal-i:hover .gal-img img{transform:scale(1.03)}.gal-i:hover b{text-decoration:underline;text-underline-offset:4px}}
.gal-b{display:flex;flex-direction:column;gap:6px;padding:14px 2px 0}
.gal-b b{font-size:18px;font-weight:800;letter-spacing:-.04em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gal-ex{font-size:14.5px;color:var(--ink2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.gal-b time{font-size:13.5px;color:var(--mute)}
.gal-mood{align-self:flex-start;height:24px;padding:0 10px;border-radius:999px;font-size:12px;font-weight:700;display:inline-flex;align-items:center;background:color-mix(in srgb,var(--mc) 40%,var(--paper));color:var(--ink)}
.dimg{display:block;width:100%;height:100%}
.dimg img{width:100%;height:100%;object-fit:cover;display:block}
.dtile{display:flex;flex-direction:column;justify-content:flex-end;width:100%;height:100%;padding:18px 20px;background:var(--soft);color:var(--ink)}
.dtile b{font-size:52px;font-weight:800;line-height:1;letter-spacing:-.05em;color:var(--green)}
:root[data-theme="dark"] .dtile b{color:var(--tone-ink)}
.dtile span{font-size:14px;font-weight:600;margin-top:6px;color:var(--ink2)}

/* 질문함 */
.ask-box{background:var(--soft);border-radius:var(--r-l);padding:32px}
.ask-box h2{font-size:23px;font-weight:800;letter-spacing:-.05em}
.ask-box > p{color:var(--ink2);font-size:15px;margin-top:4px}
.ask-box form{display:flex;flex-direction:column;gap:12px;margin-top:20px}
.ask-box textarea,.ask-box input{border-color:transparent}
.ask-box textarea{min-height:120px}
.ask-note{font-size:13.5px;color:var(--ink2)}
.ask-note b{color:var(--warn)}
.ask-box .row{justify-content:space-between}
.cnt{font-size:13.5px;color:var(--mute);font-variant-numeric:tabular-nums}
.mine{margin-top:16px;border-radius:var(--r-l);padding:20px 24px;background:var(--bg2)}
.mine h3{font-size:16px;font-weight:800}
.mine ul{list-style:none;margin:10px 0 6px;padding:0}
.mine li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 14px;padding:10px 0;border-top:1px solid var(--line);font-size:15px}
.mine li small{display:flex;align-items:center;gap:8px;color:var(--mute);font-size:13.5px}
.mine .st{font-weight:700;color:var(--green)}
.mine .st.wait{color:#9A6A12}
.mine li button{border:0;background:none;padding:0;color:var(--green);font-weight:700;text-decoration:underline;text-underline-offset:3px;font-size:13.5px}
.qa-bd{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.qa-i{border-radius:var(--r-m);background:var(--bg2);overflow:hidden}
.qa-q{width:100%;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;padding:20px 22px;background:none;border:0;text-align:left;color:inherit}
.qa-mark{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:15px;background:var(--ink);color:var(--paper)}
.qa-mark.a{background:var(--green);color:#fff}
.qa-qt{font-size:17px;font-weight:700;letter-spacing:-.03em}
.qa-qt small{display:block;font-size:13.5px;color:var(--mute);font-weight:500;margin-top:2px}
.qa-arr{width:10px;height:10px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);margin:0 8px 6px;transition:transform .2s}
.qa-q[aria-expanded="true"] .qa-arr{transform:rotate(-135deg);margin-bottom:-4px}
.qa-a{display:grid;grid-template-columns:auto minmax(0,1fr);gap:14px;padding:4px 22px 24px}
.qa-a p{white-space:pre-wrap;font-size:16px;line-height:1.85;padding-top:6px}
.qa-acts{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}
.qa-i.hl{box-shadow:inset 0 0 0 2px var(--green)}
.act{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 14px;border-radius:999px;border:1.5px solid var(--line);background:var(--paper);font-size:13.5px;font-weight:600;color:var(--ink2)}
.act svg{width:15px;height:15px}
@media (hover:hover){.act:hover{border-color:var(--green);color:var(--green)}}

/* 검색 */
.sch{display:flex;gap:8px;margin-bottom:36px}
.sch input{flex:1;height:58px;font-size:17px;border-radius:999px;padding:0 24px}
.sch .btn{min-height:58px;min-width:110px}
.sr-grp{margin-bottom:40px}
.sr-grp h3{font-size:19px;font-weight:800;margin-bottom:10px;display:flex;gap:8px;align-items:baseline}
.sr-grp h3 small{color:var(--green);font-size:15px}
.sr-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px}
.sr-list a{display:block;padding:16px 20px;border-radius:var(--r-m);background:var(--bg2);color:var(--ink);text-decoration:none}
.sr-list b{display:block;font-weight:700;font-size:16.5px}
.sr-list span{display:block;font-size:14.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sr-list time{font-size:13px;color:var(--mute)}
.sr-list mark{background:color-mix(in srgb,var(--gold) 40%,transparent);color:inherit;border-radius:3px;padding:0 1px}
@media (hover:hover){.sr-list a:hover b{text-decoration:underline;text-underline-offset:3px}}
@media (max-width:560px){.sch .btn{min-width:76px;padding:0 16px}}
.morepage{display:flex;flex-direction:column}
.morepage .sm-col{max-width:none}

/* ==================================================================
   검사 소개 · 동의
   ================================================================== */
.about{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:48px;align-items:start}
@media (max-width:980px){.about{grid-template-columns:1fr;gap:28px}}
.about-hero{display:none}
.panel{padding:0 0 40px}
.panel h2{font-size:22px;font-weight:800;letter-spacing:-.05em;margin-bottom:14px}
.panel p{color:var(--ink2)}
.panel p + p{margin-top:10px}
.panel ul{margin:0;padding-left:20px;color:var(--ink2);display:flex;flex-direction:column;gap:6px}
.panel li::marker{color:var(--green)}
.domains{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.domains div{padding:16px 18px;border-radius:var(--r-m);background:var(--bg2);display:flex;flex-direction:column;gap:2px}
.domains b{font-size:16.5px}
.domains span{font-size:14.5px;color:var(--ink2)}
.about-side{position:sticky;top:calc(var(--gh) + 20px);display:flex;flex-direction:column;gap:14px}
.about-side .panel{padding:26px;border-radius:var(--r-l);border:1.5px solid var(--line);background:var(--paper)}
.about-side .panel h2{font-size:18px}
.about-side .panel.acts{background:var(--soft);border-color:transparent}
.acts{display:flex;flex-direction:column;gap:8px}
.acts .btn{width:100%}
.kv{width:100%;border-collapse:collapse;font-size:14.5px}
.kv th{text-align:left;padding:10px 0;border-bottom:1px solid var(--line);width:96px;font-weight:700;vertical-align:top;white-space:nowrap;color:var(--ink)}
.kv td{padding:10px 0 10px 12px;border-bottom:1px solid var(--line);color:var(--ink2)}
.kv tr:last-child th,.kv tr:last-child td{border-bottom:0}
.consent{max-width:820px;margin:0 auto}
.flow{display:flex;gap:6px;margin-bottom:30px}
.flow span{flex:1;text-align:center;padding:10px 6px;font-size:14px;font-weight:600;color:var(--mute);background:var(--bg2);border-radius:999px}
.flow .on{background:var(--green);color:#fff}
@media (max-width:560px){.flow span{font-size:12px;padding:8px 2px}}
.page-h{padding:0 0 26px}
.page-h h1{font-size:26px;font-weight:800;letter-spacing:-.05em}
.page-h p{color:var(--ink2);margin-top:8px}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.facts span{height:32px;padding:0 14px;border-radius:999px;background:var(--soft);color:var(--green);font-size:13.5px;font-weight:700;display:inline-flex;align-items:center}

/* ==================================================================
   검사 진행
   ================================================================== */
.qbar{position:sticky;top:var(--gh);z-index:20;background:var(--glass);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.qbar .wrap{display:flex;align-items:center;gap:16px;height:58px}
.qbar b{font-size:14.5px;white-space:nowrap}
.track{flex:1;height:8px;border-radius:999px;background:var(--mist2);overflow:hidden}
.track i{display:block;height:100%;border-radius:999px;background:var(--green);transition:width .3s}
.qcard{padding:28px;margin-top:14px;border-radius:var(--r-l);background:var(--bg2);transition:opacity .25s}
.qcard.done{opacity:.6}
.qcard.done:hover,.qcard.done:focus-within{opacity:1}
.qcard.flag{background:var(--warn-t);box-shadow:inset 0 0 0 2px var(--warn)}
.qn{font-size:13px;font-weight:800;color:var(--green)}
:root[data-theme="dark"] .qn{color:var(--tone-ink)}
.qt{font-size:clamp(18px,2.6vw,21px);font-weight:800;letter-spacing:-.04em;margin:4px 0 18px}
.likert{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.lk{display:flex;flex-direction:column;align-items:center;gap:8px;padding:14px 4px 12px;border:1.5px solid transparent;border-radius:var(--r-m);background:var(--paper);font-size:13.5px;color:var(--ink2);line-height:1.3;-webkit-tap-highlight-color:transparent}
.lk i{width:20px;height:20px;border-radius:50%;border:2px solid var(--line2)}
@media (hover:hover){.lk:hover{border-color:var(--line2)}}
.lk[aria-checked="true"]{border-color:var(--green);color:var(--ink);font-weight:700}
.lk[aria-checked="true"] i{border-color:var(--green);background:var(--green);box-shadow:inset 0 0 0 3px var(--paper)}
@media (max-width:480px){.qcard{padding:22px 16px}.lk{font-size:11.5px;padding:12px 2px 10px}}
.pager{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:32px 0 20px}
.pager .btn{min-width:130px}
.pager .msg{flex:1;text-align:center;color:var(--warn);font-weight:600;font-size:14.5px}
@media (max-width:560px){.pager .msg{order:3;flex-basis:100%}}
.sct-q{padding:24px;margin-top:12px;border-radius:var(--r-l);background:var(--bg2);display:flex;flex-direction:column;gap:12px}
.sct-q label{display:flex;gap:12px;font-size:18px;font-weight:700;letter-spacing:-.04em}
.sct-q label b{flex:none;min-width:2.4em;color:var(--green);font-weight:800}
.sct-q textarea{min-height:64px;border-color:transparent}
.sct-q.filled label b::after{content:"✓";margin-left:4px;font-size:.8em}
.tail{color:var(--ink2);font-size:15px}
.steps{display:flex;gap:6px}
.steps span{flex:1;text-align:center;padding:10px 6px;font-size:14px;font-weight:600;color:var(--mute);background:var(--bg2);border-radius:999px}
.steps .on{background:var(--green);color:#fff}
.steps .done{color:var(--green)}
.steps .done::before{content:"✓ "}
.board{border-radius:var(--r-l);background:var(--bg2);overflow:hidden}
.tools{display:flex;flex-wrap:wrap;gap:6px;padding:12px}
.tool{display:inline-flex;align-items:center;gap:6px;height:38px;padding:0 14px;border:1.5px solid var(--line);border-radius:999px;background:var(--paper);font-size:14px;font-weight:600;color:var(--ink)}
.tool svg{width:17px;height:17px}
.tool[aria-pressed="true"]{background:var(--green);border-color:var(--green);color:#fff}
.sp{flex:1}
.canvas-wrap{position:relative;margin:4px auto 16px;background:#fff;border-radius:var(--r-m);overflow:hidden;touch-action:none;width:calc(100% - 24px)}
.canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.hint{position:absolute;inset:0;display:grid;place-items:center;color:#9AA49F;pointer-events:none;font-size:15px}
.qa{display:flex;flex-direction:column;gap:14px}
.qa label{display:block;font-weight:700;margin-bottom:6px}
.qa textarea{min-height:70px}

/* ==================================================================
   결과 보고서
   ================================================================== */
.report{background:var(--paper)}
.report-h{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 14px;padding:0 0 22px;border-bottom:2px solid var(--ink)}
.report-h b{font-size:24px;font-weight:800;letter-spacing:-.05em}
.report-h span{font-size:14px;color:var(--mute)}
.report-b > div{padding:34px 0;border-bottom:1px solid var(--line)}
.report-b > div:last-child{border-bottom:0}
.report-b > div.crisis{padding:16px 20px;margin:24px 0;border-bottom:0}
.report-b > div.caution{padding:20px 24px;margin-top:24px;border-bottom:0}
.report-b h2{font-size:21px;font-weight:800;letter-spacing:-.05em;margin-bottom:16px}
.meta-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0}
.meta-grid div{padding:14px 16px;border-radius:var(--r-s);background:var(--bg2)}
.meta-grid dt{font-size:13px;color:var(--mute);font-weight:600}
.meta-grid dd{margin:2px 0 0;font-size:15.5px;font-weight:700}
@media (max-width:760px){.meta-grid{grid-template-columns:1fr 1fr}}
.summary{font-size:17px;line-height:1.9;background:var(--soft);border-radius:var(--r-m);padding:22px 24px}
.summary b{color:var(--green)}
:root[data-theme="dark"] .summary b{color:var(--tone-ink)}
.profile{border-radius:var(--r-m);background:var(--bg2);padding:18px 14px 10px}
.profile svg{display:block;width:100%;height:auto;color:var(--ink)}
.detail{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:12px}
.detail article{border-radius:var(--r-m);border:1.5px solid var(--line);padding:22px;display:flex;flex-direction:column;gap:10px}
.dh{display:flex;align-items:center;gap:8px}
.dh b{font-size:17px}
.fdot{width:12px;height:12px;border-radius:50%;flex:none}
.lvb{margin-left:auto;font-size:12.5px;font-weight:700;padding:3px 10px;border-radius:999px}
:root[data-theme="dark"] .lvb{filter:invert(.88) hue-rotate(180deg)}
.detail p{font-size:15px;color:var(--ink2)}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.traits span{font-size:13px;font-weight:600;padding:4px 11px;border-radius:999px;background:var(--bg2)}
.grow{font-size:14.5px;border-top:1px dashed var(--line2);padding-top:12px}
.grow b{color:var(--green)}
.reflect{margin:0;padding-left:22px;display:flex;flex-direction:column;gap:8px;color:var(--ink2)}
.reflect li::marker{color:var(--green);font-weight:800}
.caution{background:var(--bg2);border-radius:var(--r-m);padding:20px 24px;font-size:14.5px;color:var(--ink2)}
.caution b{display:block;color:var(--ink);margin-bottom:6px;font-size:15px}
.caution ul{margin:0;padding-left:18px}
.grp{font-size:17px;font-weight:800;color:var(--green);margin:26px 0 8px}
.grp:first-of-type{margin-top:4px}
.area{border-radius:var(--r-m);background:var(--bg2);margin-top:10px;overflow:hidden}
.area h3{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:14px 18px 4px;font-size:15px}
.area .pill{background:var(--paper)}
.area ul{list-style:none;margin:0;padding:4px 18px 12px}
.area li{padding:10px 0;border-bottom:1px solid var(--line);font-size:15px}
.area li:last-child{border-bottom:0}
.stem{color:var(--mute)}
.ans{font-weight:700;color:var(--ink)}
.ans.blank{color:var(--mute);font-weight:400}
.gallery{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.gallery figure{margin:0;border-radius:var(--r-m);background:var(--bg2);padding:14px;display:flex;flex-direction:column;gap:10px}
.gallery img{width:100%;border-radius:var(--r-s);background:#fff}
.gallery figcaption{font-weight:800}
.gallery .btn{align-self:flex-start}
.gallery dl{margin:0;font-size:14px}
.gallery dt{color:var(--mute);margin-top:8px}
.gallery dd{margin:2px 0 0}
.look{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.look div{border-radius:var(--r-m);background:var(--bg2);padding:16px 18px}
.look b{display:block}
.look span{font-size:14px;color:var(--ink2)}

/* ---------- 이용 안내 ---------- */
.guide{display:flex;flex-direction:column}
.guide > .crisis{margin-top:8px}
.proc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;counter-reset:p}
.proc div{counter-increment:p;padding:22px 20px;border-radius:var(--r-m);background:var(--bg2);display:flex;flex-direction:column;gap:4px}
.proc div::before{content:counter(p);display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--green);color:#fff;font-weight:800;font-size:14px;margin-bottom:8px}
.proc b{font-size:17px}
.proc span{font-size:14.5px;color:var(--ink2)}
@media (max-width:760px){.proc{grid-template-columns:1fr 1fr}}
.faq{display:flex;flex-direction:column;gap:8px}
.faq details{border-radius:var(--r-m);background:var(--bg2);overflow:hidden}
.faq summary{position:relative;padding:18px 48px 18px 22px;font-weight:700;cursor:pointer;list-style:none}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";position:absolute;right:22px;top:50%;width:9px;height:9px;margin-top:-6px;border-right:2px solid var(--ink2);border-bottom:2px solid var(--ink2);transform:rotate(45deg);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(-135deg);margin-top:-2px}
.faq details p{padding:0 22px 20px;color:var(--ink2)}

/* ---------- 상담 · 내 신청 ---------- */
.consult-band{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:20px;padding:30px 34px;border-radius:var(--r-l);background:var(--soft)}
.consult-band h3{font-size:21px;font-weight:800;letter-spacing:-.05em}
.consult-band ul{margin:8px 0 0;padding-left:18px;color:var(--ink2);font-size:15px}
.ok-box{border-radius:var(--r-l);background:var(--soft);padding:48px 28px;text-align:center;display:flex;flex-direction:column;gap:14px;align-items:center}
.ok-box p{color:var(--ink2)}
.req{border-radius:var(--r-l);background:var(--bg2);margin-bottom:12px;overflow:hidden}
.req-h{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:18px 22px 6px}
.req-h .pill{background:var(--paper)}
.req dl{display:grid;grid-template-columns:110px 1fr;gap:8px 12px;margin:0;padding:10px 22px;font-size:14.5px}
.req dt{color:var(--mute)}
.req dd{margin:0}
.req .msg{padding:0 22px 20px;white-space:pre-wrap;color:var(--ink2);font-size:15px}

/* ---------- 관리 ---------- */
.atabs{display:flex;gap:6px;margin-bottom:18px;overflow-x:auto}
.atabs button{flex:none;height:44px;padding:0 20px;border:0;border-radius:999px;background:var(--bg2);font-weight:700;color:var(--ink2)}
.atabs button[aria-selected="true"]{background:var(--ink);color:var(--paper)}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:96px 1fr;gap:14px;align-items:center;width:100%;padding:12px 4px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;color:inherit}
.item .dimg{aspect-ratio:4/3;overflow:hidden;border-radius:var(--r-s)}
.item .dtile{padding:8px 10px}
.item .dtile b{font-size:26px}
.item .dtile span{font-size:10.5px}
.item h3{font-size:16px;font-weight:700}
.item time{font-size:13px;color:var(--mute)}
.tag{font-size:11.5px;font-weight:800;color:var(--green);letter-spacing:.04em}
@media (hover:hover){.item:hover h3{text-decoration:underline;text-underline-offset:3px}}
.ph-prev{display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap}
.ph-prev img{max-width:220px;border-radius:var(--r-s)}
.inbox{border-radius:var(--r-l);background:var(--soft);padding:24px 26px;margin-bottom:36px}
.ib-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.ib-h h3{font-size:19px;font-weight:800;display:flex;align-items:center;gap:8px}
.ib-n{display:inline-grid;place-items:center;min-width:24px;height:24px;padding:0 7px;border-radius:999px;background:var(--gold);color:#3A2A05;font-size:13px}
.ib-list{list-style:none;margin:0;padding:0}
.ib-list li{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px;padding:14px 0;border-top:1px solid var(--line)}
.ib-list p{font-weight:700;white-space:pre-wrap}
.ib-list small{color:var(--mute);font-size:13px}
.ib-login .row{flex-wrap:nowrap;margin-top:10px}
@media (max-width:620px){.ib-login .row{flex-wrap:wrap}}

/* ==================================================================
   빛·유리 층 — 레퍼런스처럼 어두운 바탕 위에 비치는 카드와 빛
   ================================================================== */
input[type=text],input[type=email],input[type=tel],input[type=password],input[type=search],input[type=date],input:not([type]),select,textarea{background:var(--field);border-color:var(--line2)}
select option{background:var(--elev);color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--violet);box-shadow:0 0 0 4px rgba(139,108,255,.22)}

.tcard,.res,.about-side .panel,.detail article{border:1px solid var(--line)}
.bv,.report{background:transparent}

.lk{border:1px solid var(--line)}

.pill.ok,.tc-meta .done{background:rgba(61,217,235,.12);color:#8EF0FA}
.pill.wait,.tc-meta .wait{background:rgba(242,123,196,.14);color:#FFB3DD}

:root[data-theme="light"] .pill.wait,:root[data-theme="light"] .tc-meta .wait{color:#B02F7E}
.mine .st{color:#8EF0FA}.mine .st.wait{color:#FFB3DD}
.mine li button,.check b,.grow b,.summary b,.qn,.sct-q label b,.grp,.bd .c-cat,.bd-count b,.more-lnk,.bv-cat,.dtile b{color:var(--tone-ink)}
.bd-pin,.bd .new,.ib-n{background:var(--pink);color:#fff}
.bd tr.pinned{background:var(--soft)}
.report-h{border-bottom-color:var(--line2)}
.tc-meta span{background:var(--mist2)}
.qa-mark.a,.qa-mini .qm,.owner-bar .ava,.proc div::before{background:var(--grad);color:#fff}
.faq details p::before{color:var(--pink)}
.dtile{background:linear-gradient(140deg,rgba(139,108,255,.30),rgba(54,207,230,.12))}
.gal-img{background:var(--bg2);border:1px solid var(--line)}
.ask-box{background:linear-gradient(135deg,rgba(139,108,255,.20),rgba(54,207,230,.08));border:1px solid var(--line2)}
.ask-box textarea,.ask-box input{border-color:var(--line)}
.ask-cta{background:var(--soft);border:1px solid rgba(139,108,255,.3)}
.inbox{background:var(--soft);border:1px solid rgba(139,108,255,.3)}
.setup-note{background:rgba(242,123,196,.10);border:1px solid rgba(242,123,196,.3)}
.consult-band,.ok-box{background:linear-gradient(135deg,rgba(139,108,255,.22),rgba(54,207,230,.08));border:1px solid var(--line2)}
@media (hover:hover){a.tcard:hover{border-color:rgba(139,108,255,.65);box-shadow:0 18px 44px rgba(91,70,230,.25);transform:translateY(-3px)}}
.tcard .plate{width:58px}
.tc-topic{color:var(--mute)}

/* 처음 화면 */
.hero{background:none;text-align:left;padding:64px 0 0;overflow:visible}
.hero-in{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center}
.hero h1{font-size:clamp(40px,5.4vw,72px);font-weight:700;letter-spacing:-.065em;line-height:1.14}
.hero h1 .grad-t{display:inline}
.hero-sub{margin:20px 0 0;padding:0;max-width:28em}
.hero-note{background:var(--bg2);border:1px solid var(--line);margin-bottom:26px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.hero-note b{background:var(--grad)}
.chips{justify-content:flex-start;margin:34px 0 0;padding:0;max-width:none}
.chips button{background:var(--bg2);border:1px solid var(--line2);color:var(--ink);height:50px;padding:0 20px;font-size:15.5px;font-weight:600;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
@media (hover:hover){.chips button:hover{border-color:rgba(183,166,255,.7)}}
.chips button[aria-pressed="true"]{background:var(--grad);border-color:transparent;color:#fff;box-shadow:var(--glow)}
.hero-vis{position:relative;height:520px}
.blob{position:absolute;left:8%;top:10%;width:78%;height:76%;border-radius:42% 58% 62% 38% / 46% 40% 60% 54%;background:linear-gradient(135deg,rgba(154,114,255,.42),rgba(91,91,240,.22) 50%,rgba(54,207,230,.22));border:1px solid rgba(255,255,255,.16);box-shadow:inset 0 0 60px rgba(255,255,255,.08),0 40px 90px rgba(80,60,220,.35);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
@media (prefers-reduced-motion:no-preference){.blob{animation:morph 14s ease-in-out infinite alternate}}
@keyframes morph{0%{border-radius:42% 58% 62% 38% / 46% 40% 60% 54%;transform:rotate(0)}100%{border-radius:58% 42% 38% 62% / 56% 60% 40% 44%;transform:rotate(8deg)}}
.hero-vis .plate{position:absolute;width:96px}
.hv-card{padding:14px 16px;display:flex;align-items:center;gap:12px;font-size:13.5px;color:var(--ink2);white-space:nowrap}
.hv-card b{display:block;color:var(--ink);font-size:15px}
.hv-card i{display:block;width:34px;height:34px;border-radius:50%;background:conic-gradient(from 200deg,#9A72FF,#36CFE6,#F27BC4,#FF9A4C,#9A72FF);box-shadow:0 0 16px rgba(154,114,255,.6)}
:root[data-theme="light"] .gl-card{background:rgba(255,255,255,.62);border-color:rgba(40,30,110,.12)}
@media (max-width:980px){.hero-in{grid-template-columns:1fr}.hero-vis{height:360px;margin-top:-10px}}
@media (max-width:600px){.hero{padding-top:40px}.hero-vis{display:none}.chips button{height:44px;padding:0 16px;font-size:14.5px}}
.picked{max-width:none;margin:48px 0 0;border-radius:var(--r-l);padding:28px 32px;background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(255,255,255,.03));border:1px solid var(--line2);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.picked .plate{width:88px}
.picked small{color:var(--cyan)}
:root[data-theme="light"] .picked small{color:#0E7C8C}
@media (max-width:760px){.picked{margin-top:32px;border-radius:24px;padding:24px 20px}.picked .plate{width:60px}}
/* 마음 구슬 배너 */
.orb-bnr{position:relative;display:grid;grid-template-columns:minmax(0,1fr) 300px;align-items:center;gap:24px;overflow:hidden;border-radius:34px;padding:44px 48px;text-decoration:none;color:#fff;background:linear-gradient(120deg,#5B3FE0 0%,#7A4DF0 35%,#C460D6 70%,#F27BC4 100%);box-shadow:0 30px 70px rgba(110,70,230,.35)}
.orb-bnr::after{content:"";position:absolute;inset:0;background:radial-gradient(40% 70% at 85% 50%,rgba(255,255,255,.25),transparent 70%);pointer-events:none}
.orb-bnr small{font-size:14px;font-weight:700;opacity:.85}
.orb-bnr h2{font-size:clamp(28px,3.4vw,42px);font-weight:700;letter-spacing:-.055em;margin-top:6px;color:#fff}
.orb-bnr p{opacity:.88;margin-top:10px;max-width:30em}
.orb-bnr .go{display:inline-flex;align-items:center;gap:10px;margin-top:24px;height:52px;padding:0 8px 0 24px;border-radius:999px;background:#fff;color:#2A1A66;font-weight:700}
.orb-bnr .go i{display:grid;place-items:center;width:38px;height:38px;border-radius:50%;background:#2A1A66;color:#fff}
.orb-bnr .go svg{width:15px;height:15px}
.orb-mini{position:relative;justify-self:center;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle at 32% 28%,rgba(255,255,255,.9),transparent 15%),radial-gradient(circle at 72% 30%,#F27BC4,transparent 48%),radial-gradient(circle at 28% 74%,#36CFE6,transparent 52%),radial-gradient(circle at 76% 78%,#FF9A4C,transparent 46%),radial-gradient(circle at 50% 50%,#9A72FF,#5B3FE0 72%);filter:saturate(1.15);box-shadow:inset -18px -24px 50px rgba(30,10,80,.45),0 0 80px rgba(255,255,255,.35)}
@media (prefers-reduced-motion:no-preference){.orb-mini{animation:spin 18s linear infinite}}
@keyframes spin{to{filter:saturate(1.15) hue-rotate(360deg)}}
@media (hover:hover){.orb-bnr:hover .go i{transform:rotate(-45deg)}.orb-bnr .go i{transition:transform .3s}}
@media (max-width:760px){.orb-bnr{grid-template-columns:1fr;padding:32px 24px;border-radius:28px}.orb-mini{width:150px;height:150px;grid-row:1;justify-self:start}}
.cband{position:relative;overflow:hidden;background:linear-gradient(135deg,rgba(139,108,255,.30),rgba(54,207,230,.10));border:1px solid var(--line2);color:var(--ink)}
:root[data-theme="dark"] .cband,:root:not([data-theme]) .cband{background:linear-gradient(135deg,rgba(139,108,255,.30),rgba(54,207,230,.10))}
.cband h2{color:var(--ink)}
.cband .btn-w{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.cband .btn-g{color:var(--ink);border-color:var(--line2);background:var(--bg2)}
.cband .crisis-l b{color:var(--pink)}
.csteps li{background:var(--bg2);border:1px solid var(--line)}
.csteps li::before{background:var(--grad);color:#fff}
.cband .sph{opacity:.9}

/* ==================================================================
   레퍼런스 구성 층 — 그라데이션 카드 + 입력 판 (로그인·문의 화면처럼)
   ================================================================== */
#view{padding-top:20px}
body.is-home #view{padding-top:8px}
.hero{padding:24px 0 0}
.auth{position:relative;display:grid;grid-template-columns:minmax(0,.95fr) minmax(0,1.05fr);gap:22px;padding:14px;border-radius:34px;background:var(--paper2);border:1px solid var(--line);box-shadow:var(--shadow)}
.auth.auth-r{grid-template-columns:minmax(0,1.15fr) minmax(0,.85fr)}
.auth-form{padding:30px 28px 28px;display:flex;flex-direction:column;min-width:0}
.auth-form h2{font-size:26px;font-weight:800;letter-spacing:-.05em}
.auth-form > .help{margin-top:4px}
.hero-card{min-height:540px;display:flex;flex-direction:column;justify-content:center;padding:48px 44px}
.hero-card .hc-k{font-size:14px;font-weight:700;opacity:.85}
.hero-card h1{font-size:clamp(36px,4.4vw,58px);line-height:1.12;margin-top:10px}
.hc-sub{margin-top:14px;opacity:.9;max-width:22em;font-size:16px}
.g-card .arrow{position:absolute;right:30px;bottom:28px;width:110px;opacity:.38}
.hero .chips{margin:20px 0 0;gap:8px}
.hero .chips button{height:44px;padding:0 16px;font-size:14.5px}
.auth-form .picked{display:grid;grid-template-columns:60px minmax(0,1fr);gap:4px 16px;margin:22px 0 0;padding:20px;border-radius:22px;background:var(--bg2);border:1px solid var(--line);box-shadow:none;-webkit-backdrop-filter:none;backdrop-filter:none}
.auth-form .picked .plate{width:60px}
.auth-form .picked h2{font-size:21px;margin:0 0 4px}
.auth-form .picked p{font-size:14.5px}
.auth-form .picked .row{grid-column:1/-1;flex-direction:column;align-items:stretch;gap:8px;margin-top:14px}
.auth-form .picked .btn-lg{min-height:52px}
.auth-alt{display:flex;align-items:center;gap:12px;margin:18px 0 14px;color:var(--mute);font-size:13px}
.auth-alt::before,.auth-alt::after{content:"";flex:1;height:1px;background:var(--line)}
.hero-note{margin-bottom:16px}
.side-card{display:flex;flex-direction:column;justify-content:center;min-height:420px;overflow:visible}
.side-card::before{border-radius:inherit}
.side-card h2{font-size:clamp(30px,3.4vw,44px);line-height:1.15}
.side-card p{margin-top:14px;opacity:.9}
.sc-steps{margin:22px 0 0;padding:0;list-style:none;counter-reset:s;display:flex;flex-direction:column;gap:10px}
.sc-steps li{counter-increment:s;display:flex;align-items:center;gap:12px;font-weight:600}
.sc-steps li::before{content:counter(s);display:grid;place-items:center;flex:none;width:28px;height:28px;border-radius:50%;background:rgba(255,255,255,.25);font-weight:800;font-size:13px}
.sc-note{font-size:13.5px;opacity:.8!important}
.auth-r .auth-form .page-h{padding-bottom:18px}
.auth-r .side-card{align-self:start;position:sticky;top:calc(var(--gh) + 20px)}
@media (max-width:900px){.auth-r .side-card{position:relative;top:auto}}
.ask-box.auth-form{background:none;border:0;padding:30px 28px 28px}
.ask-below{max-width:900px;margin:0 auto}
@media (max-width:900px){.hero-auth > .sph,.hero-auth > .coil{display:none}.g-card > .sph{transform:scale(.6)}.side-card > .sph{display:none}}
.ask-below .mine{margin-top:28px}
@media (max-width:900px){
  .auth,.auth.auth-r{grid-template-columns:1fr;padding:10px;border-radius:28px}
  .hero-card{min-height:340px;padding:36px 28px}
  .side-card{min-height:0;padding:34px 26px}
  .auth-form{padding:22px 14px 16px}
  .auth-r .side-card{order:-1}
}
/* 비어 있을 때 · 찾을 수 없을 때 (404 화면처럼) */
.fempty{position:relative;padding:136px 20px 52px;border:1px solid var(--line)}
.fempty::before{content:"";position:absolute;left:50%;top:40px;width:72px;height:72px;margin-left:-36px;border-radius:50%;background:radial-gradient(circle at 32% 26%,#fff 0,rgba(255,255,255,.9) 6%,#B8A2FF 22%,#6A4BF2 60%,#2A1680 100%);box-shadow:inset -8px -12px 22px rgba(10,6,40,.42),0 16px 36px rgba(70,40,200,.35)}

.qa-bd .fempty,.qa-mini .msg{border:1px solid var(--line)}
/* 처음 화면 아래 구역 간격 */
.hsec{padding-top:96px}
.orb-bnr{border-radius:30px}

/* ==================================================================
   ASK (에스크 사이트처럼)
   ================================================================== */
.askp{max-width:720px}
.ap-prof{position:relative;border-radius:28px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;padding:0 26px 22px}
.ap-cover{height:110px;margin:0 -26px;background:var(--grad)}
.ap-row{position:relative;display:flex;align-items:flex-start;gap:14px;margin-top:-38px}
.ap-ava{flex:none;display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--grad-btn);border:4px solid var(--paper);box-shadow:0 8px 20px rgba(80,40,200,.35)}
.ap-ava svg{width:40%;height:40%}
.ap-who{flex:1;min-width:0;padding-top:44px}
.ap-who h1{font-size:22px;font-weight:800;letter-spacing:-.04em}
.ap-id{font-size:13.5px;color:var(--mute)}
.ap-row .btn{margin-top:50px}
.ap-bio{margin-top:14px;color:var(--ink2);font-size:15px}
.ap-stats{list-style:none;margin:14px 0 0;padding:0;display:flex;gap:22px;font-size:14px;color:var(--mute)}
.ap-stats b{color:var(--ink);font-size:17px;margin-right:6px}
.ap-ask{margin-top:16px;border-radius:24px;background:var(--bg2);border:1px solid var(--line);padding:18px 18px 14px}
.ap-ask textarea{min-height:110px;border:0;background:transparent;padding:4px 4px;font-size:17px;resize:none;box-shadow:none}
.ap-ask textarea:focus{box-shadow:none}
.ap-ask:focus-within{border-color:rgba(156,107,255,.6);box-shadow:0 0 0 4px rgba(123,60,255,.16)}
.ap-foot{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding-top:12px;border-top:1px solid var(--line)}
.ap-anon{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:var(--ink2);cursor:pointer}
.ap-anon input{width:18px;height:18px;accent-color:var(--violet)}
.ap-foot input[type=text]{width:150px;height:38px;font-size:14px;border-radius:999px;padding:0 14px}
.ap-foot .cnt{margin-left:auto}
.ap-ask .ask-note{margin-top:8px;font-size:12.5px}
.ap-ask .err{margin-top:6px}
.ap-tabs{display:flex;gap:4px;margin:30px 0 14px;border-bottom:1px solid var(--line)}
.ap-tabs button{position:relative;height:46px;padding:0 16px;border:0;background:none;font-size:15px;font-weight:700;color:var(--mute)}
.ap-tabs button span{font-weight:600;margin-left:2px}
.ap-tabs button[aria-selected="true"]{color:var(--ink)}
.ap-tabs button[aria-selected="true"]::after{content:"";position:absolute;left:12px;right:12px;bottom:-1px;height:3px;border-radius:3px;background:var(--grad)}
.ap-feed{display:flex;flex-direction:column;gap:12px}
.ap-card{border-radius:24px;background:var(--bg2);border:1px solid var(--line);overflow:hidden;transition:box-shadow .3s,border-color .3s}
.ap-card.hl{border-color:rgba(156,107,255,.7);box-shadow:0 0 0 4px rgba(123,60,255,.18)}
.ap-q{padding:20px 22px 16px}
.ap-q p{font-size:18px;font-weight:700;letter-spacing:-.03em;white-space:pre-wrap;line-height:1.5}
.ap-meta{display:block;margin-top:6px;font-size:13px;color:var(--mute)}
.ap-a{display:flex;gap:12px;padding:16px 22px;border-top:1px solid var(--line);background:var(--soft)}
.ap-a .ap-ava{width:38px;height:38px;border-width:2px;box-shadow:none}
.ap-ab{min-width:0;flex:1}
.ap-ah{display:flex;align-items:baseline;gap:8px}
.ap-ah b{font-size:14.5px}
.ap-ah time{font-size:12.5px;color:var(--mute)}
.ap-ab p{margin-top:4px;white-space:pre-wrap;font-size:15.5px;line-height:1.8;color:var(--ink)}
.ap-acts{display:flex;gap:6px;justify-content:flex-end;padding:10px 16px 14px}
.ap-acts .act{height:32px;font-size:13px}
.ap-mine ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.ap-mine li{border-radius:20px;background:var(--bg2);border:1px solid var(--line);padding:16px 20px}
.ap-mine li p{font-weight:600;white-space:pre-wrap}
.ap-mine small{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px;color:var(--mute);font-size:13px}
.ap-mine .st{font-weight:700;color:#8EF0FA}
.ap-mine .st.wait{color:#FFB3DD}
:root[data-theme="light"] .ap-mine .st{color:#0E7C8C}:root[data-theme="light"] .ap-mine .st.wait{color:#B02F7E}
.ap-mine small button{border:0;background:none;padding:0;color:var(--tone-ink);font-weight:700;text-decoration:underline;text-underline-offset:3px}
.ap-mine .help{margin-top:10px}
@media (max-width:560px){.ap-prof{padding:0 18px 18px}.ap-cover{margin:0 -18px;height:90px}.ap-ava{width:70px;height:70px}.ap-who{padding-top:40px}.ap-who h1{font-size:19px}.ap-row .btn{display:none}.ap-q,.ap-a{padding-left:18px;padding-right:18px}.ap-foot input[type=text]{width:120px}}

/* ---------- 왼쪽 카드: 올린 사진 미리보기 ---------- */
.hero-card.media{padding:0;justify-content:stretch}
.hero-card.media::before{display:none}
.hm{position:relative;display:block;width:100%;height:100%;min-height:540px;padding:0;border:0;background:#000;color:#fff;text-align:left;border-radius:inherit;overflow:hidden;cursor:pointer}
.hm img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform 1.2s cubic-bezier(.2,.7,.2,1)}
@media (hover:hover){.hm:hover img{transform:scale(1.04)}}
.hm-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(10,6,40,0) 40%,rgba(10,6,40,.85) 100%),linear-gradient(135deg,rgba(63,211,255,.25),rgba(227,111,224,.25))}
.hm-cap{position:absolute;left:30px;right:30px;bottom:28px;display:flex;flex-direction:column;gap:4px}
.hm-cap small{font-size:13px;font-weight:600;opacity:.85}
.hm-cap b{font-size:clamp(24px,2.6vw,32px);font-weight:800;letter-spacing:-.045em;line-height:1.25}
.hm-cap em{font-style:normal;align-self:flex-start;margin-top:10px;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.18);border:1px solid rgba(255,255,255,.3);font-size:13px;font-weight:700;-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.hm-nav{position:absolute;right:18px;top:18px;display:flex;align-items:center;gap:8px;padding:4px;border-radius:999px;background:rgba(10,6,40,.45);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);color:#fff;font-size:12.5px;font-weight:700}
.hm-nav button{display:grid;place-items:center;width:30px;height:30px;border:0;border-radius:50%;background:rgba(255,255,255,.14);color:#fff;padding:0}
.hm-nav svg{width:13px;height:13px}
@media (max-width:900px){.hm{min-height:340px}}
/* 오른쪽 판: 열린 글 */
.hp-in{animation:hpIn .5s cubic-bezier(.2,.7,.2,1) both}

/* ---------- SHA-256 (관리자 코드 확인용) ---------- */
function sha256hex(str){
  function rr(n,x){return (x>>>n)|(x<<(32-n));}
  var K=[],H=[],i,j,p=2;
  function isP(n){for(var f=2;f*f<=n;f++) if(n%f===0) return false; return true;}
  for(i=0;i<64;p++){ if(isP(p)){ if(i<8) H[i]=(Math.pow(p,1/2)*4294967296)|0; K[i]=(Math.pow(p,1/3)*4294967296)|0; i++; } }
  var bytes=unescape(encodeURIComponent(str)), l=bytes.length, words=[];
  for(i=0;i<l;i++) words[i>>2]|=(bytes.charCodeAt(i)&255)<<(24-(i%4)*8);
  words[l>>2]|=0x80<<(24-(l%4)*8); words[((l+8)>>6<<4)+15]=l*8;
  for(j=0;j<words.length;j+=16){
    var w=[], a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      if(i<16) w[i]=words[j+i]|0;
      else { var s0=rr(7,w[i-15])^rr(18,w[i-15])^(w[i-15]>>>3), s1=rr(17,w[i-2])^rr(19,w[i-2])^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
      var t1=(h+(rr(6,e)^rr(11,e)^rr(25,e))+((e&f)^(~e&g))+K[i]+w[i])|0, t2=((rr(2,a)^rr(13,a)^rr(22,a))+((a&b)^(a&c)^(b&c)))|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(function(x){ return ("00000000"+(x>>>0).toString(16)).slice(-8); }).join("");
}

async function ghFetchNotices(c){

  if(!r.ok) throw {status:r.status};

}
async function ghSaveNotices(c,list,sha,msg){
  var url="https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/notices.json";
  var body={message:msg,content:b64e(JSON.stringify({notices:list},null,2)+"\n"),branch:c.branch||"main"}; if(sha) body.sha=sha;
  var r=await fetch(url,{method:"PUT",headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw {status:r.status};
}
function ghErr(e){ var s=e&&e.status; return s===401?"토큰이 맞지 않거나 만료됐어요. 연결 설정에서 토큰을 다시 넣어 주세요.":s===403?"토큰에 저장소 쓰기 권한이 없어요. Contents 권한을 Read and write로 만들어 주세요.":s===404?"저장소를 찾지 못했어요. 사용자명과 저장소 이름을 확인해 주세요.":s===409?"다른 곳에서 먼저 공지가 바뀌었어요. 다시 눌러 주세요.":"GitHub에 저장하지 못했어요. 인터넷 연결을 확인해 주세요."; }

}
async function ghPutFile(c,path,b64,msg,sha){
  var body={message:msg,content:b64,branch:c.branch||"main"}; if(sha) body.sha=sha;
  var r=await fetch("https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/"+path,{method:"PUT",headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw {status:r.status};
}
async function ghDeleteFile(c,path,msg){
  var g=await fetch("https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/"+path+"?ref="+encodeURIComponent(c.branch||"main"),{headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"},cache:"no-store"});
  if(!g.ok) return;
  var j=await g.json();
  await fetch("https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/"+path,{method:"DELETE",headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({message:msg,sha:j.sha,branch:c.branch||"main"})});

    if(!t||!b){ $("#dErr").textContent="제목과 내용을 모두 적어 주세요."; return; }
    var id=x?x.id:uid(), when=dv?new Date(dv+"T12:00:00").getTime():Date.now();
    var data={id:id,title:t,body:b,mood:$("#dM").value,date:when,photo:x&&x.photo&&!dropPhoto?x.photo:"",edited:x?Date.now():null};
    var path="uploads/"+id+"-"+Date.now().toString(36)+".jpg";
    var up=photoData?function(){ return ghPutFile(c,path,photoData.split(",")[1],"사진 올리기: "+t).then(function(){ data.photo=path; }); }:null;
    commit(function(l){ var i=-1; l.forEach(function(n,k){ if(n.id===data.id) i=k; }); if(i>-1) l[i]=data; else l.push(data); return l; },(x?"기록 수정: ":"기록 추가: ")+t,(x?"기록을 고쳤어요":"기록을 올렸어요")+". 1~2분 뒤 사이트에 반영돼요.",up);
  };
}

function renderAskAdmin(el){

  el.innerHTML='<section class="inbox" id="inboxBox" aria-live="polite"></section><form class="form" id="af" novalidate><h3 style="font-size:19px;font-weight:800">'+(x?'답변 고치기':'질문에 답하기')+'</h3>'+
    '<p class="note">질문은 설정한 이메일로 와요. 메일 속 링크를 누르면 질문이 여기에 자동으로 채워져요. 답변을 올리면 질문과 함께 ASK 페이지에 공개돼요.</p>'+
    '<div class="f"><label for="aQ">질문</label><textarea id="aQ" maxlength="500" style="min-height:90px">'+esc(x?x.q:(pre.q||""))+'</textarea></div>'+
    '<div class="f"><label for="aN">질문한 사람 닉네임 (선택)</label><input id="aN" maxlength="20" value="'+esc(x?(x.nick||""):(pre.nick||""))+'" placeholder="비우면 익명"></div>'+
    '<div class="f"><label for="aA">답변</label><textarea id="aA" maxlength="3000" style="min-height:170px">'+esc(x?x.a:"")+'</textarea></div>'+
    '<p class="err" id="aErr" role="alert"></p><div class="row"><button class="btn btn-main" type="submit"'+(ready?'':' disabled')+'>'+(x?'고친 답변 올리기':'답변 올리기')+'</button>'+(x||pre.q?'<button class="btn btn-line" type="button" id="aNew">비우기</button>':'')+(x?'<button class="btn btn-danger" type="button" id="aDel"'+(ready?'':' disabled')+'>삭제</button>':'')+'</div>'+adminSaveNote()+'</form>'+
    '<h3 style="font-size:17px;font-weight:800;margin:30px 0 10px">공개한 답변 '+asks.length+'개</h3><div class="list">'+(asks.length?asks.map(function(n){ return '<button class="item" type="button" data-edit-a="'+n.id+'" style="grid-template-columns:1fr"><span><span class="tag">Q&amp;A</span><h3>'+esc(n.q.length>70?n.q.slice(0,70)+"…":n.q)+'</h3><time>'+fmtDate(n.aDate)+'</time></span></button>'; }).join(""):'<div class="empty">아직 답변한 질문이 없어요.</div>')+'</div>';
  $$("[data-edit-a]").forEach(function(b){ b.onclick=function(){ editingAsk=b.dataset.editA; askPrefill=null; renderAskAdmin(el); window.scrollTo(0,0); }; });
  async function commit(mutate,msg,done,inboxId){
    var err=$("#aErr"); err.textContent="GitHub에 저장하는 중…";
    try{ var cur=await ghGetList(c,"asks.json","asks"), list=mutate(cur.list.slice()); await ghPutFile(c,"asks.json",wrapList("asks",list),msg,cur.sha); if(inboxId) MBInbox.markAnswered(inboxId).catch(function(){}); asks=list.slice().sort(function(a,b){ return (b.aDate||0)-(a.aDate||0); }); editingAsk=null; askPrefill=null; toast(done); renderAskAdmin(el); }
    catch(e){ err.textContent=ghErr(e); }
  }
  var nb=$("#aNew"); if(nb) nb.onclick=function(){ editingAsk=null; askPrefill=null; renderAskAdmin(el); };
  renderInbox(el);
  if(x) $("#aDel").onclick=function(){ var b=this; if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="정말 삭제할까요?"; return; } commit(function(l){ return l.filter(function(n){return n.id!==x.id;}); },"답변 삭제","답변을 삭제했어요. 1~2분 뒤 사이트에 반영돼요."); };
  $("#af").onsubmit=function(e){
    e.preventDefault(); var q=$("#aQ").value.trim(), a=$("#aA").value.trim();
    if(!q||!a){ $("#aErr").textContent="질문과 답변을 모두 적어 주세요."; return; }
    var fromInbox=!x&&pre.id&&window.MBInbox&&MBInbox.user()?pre.id:null;
    var data={id:x?x.id:(pre.id||uid()),q:q,nick:$("#aN").value.trim(),a:a,qDate:x?x.qDate:(pre.date||Date.now()),aDate:x?x.aDate:Date.now(),edited:x?Date.now():null};
    commit(function(l){ var i=-1; l.forEach(function(n,k){ if(n.id===data.id) i=k; }); if(i>-1) l[i]=data; else l.push(data); return l; },(x?"답변 수정: ":"답변 추가: ")+q.slice(0,30),(x?"답변을 고쳤어요":"답변을 올렸어요")+". 1~2분 뒤 사이트에 반영돼요.",fromInbox);
  };
}
/* ---------- 새로 온 질문 (Firebase 받은 편지함) ---------- */
var inboxOff=null;
function renderInbox(host){
  var box=$("#inboxBox"); if(!box) return;
  var IB=window.MBInbox;
  if(inboxOff){ inboxOff(); inboxOff=null; }
  if(!IB||!IB.ready){ box.innerHTML='<div class="ib-h"><h3>새로 온 질문</h3></div><p class="help">새 질문을 사이트에서 바로 보고, 메뉴에 숫자로 알림을 받으려면 site-config.js에 Firebase 설정을 넣어 주세요. 설정 방법은 「질문함-알림-설정.md」에 있어요. 그전까지 질문은 이메일로만 와요.</p>'; return; }
  IB.start();
  function draw(){
    var u=IB.user(), L=IB.list();
    if(!u){
      box.innerHTML='<div class="ib-h"><h3>새로 온 질문</h3></div><form class="ib-login" id="ibF" novalidate><p class="help">질문함 계정(Firebase에 만든 운영자 계정)으로 한 번 로그인하면, 새 질문 수가 메뉴에 숫자로 떠요.</p><div class="row"><label class="sr" for="ibE">이메일</label><input id="ibE" type="email" autocomplete="username" placeholder="운영자 이메일"><label class="sr" for="ibP">비밀번호</label><input id="ibP" type="password" autocomplete="current-password" placeholder="비밀번호"><button class="btn btn-main" type="submit">로그인</button></div><p class="err" id="ibErr" role="alert"></p></form>';
      $("#ibF").onsubmit=function(e){ e.preventDefault(); $("#ibErr").textContent="로그인하는 중…"; IB.signIn($("#ibE").value.trim(),$("#ibP").value).catch(function(){ $("#ibErr").textContent="이메일이나 비밀번호가 맞지 않아요."; }); };
      return;
    }
    box.innerHTML='<div class="ib-h"><h3>새로 온 질문 <span class="ib-n">'+L.length+'</span></h3><button class="act" type="button" id="ibOut">질문함 로그아웃</button></div>'+
      (L.length?'<ul class="ib-list">'+L.map(function(q){ return '<li><div><p>'+esc(q.q)+'</p><small>'+esc(q.nick||"익명")+' · '+ago(q.date)+'</small></div><div class="row"><button class="btn btn-main btn-sm" type="button" data-ib-ans="'+esc(q.id)+'">답하기</button><button class="btn btn-danger btn-sm" type="button" data-ib-del="'+esc(q.id)+'">지우기</button></div></li>'; }).join("")+'</ul>'
        :'<p class="help">답하지 않은 질문이 없어요.</p>');
    $("#ibOut").onclick=function(){ IB.signOut(); };
    $$("[data-ib-ans]",box).forEach(function(b){ b.onclick=function(){ var q=L.filter(function(x){return x.id===b.dataset.ibAns;})[0]; if(!q) return; editingAsk=null; askPrefill={id:q.id,q:q.q,nick:q.nick,date:q.date}; renderAskAdmin(host); var a=$("#aA"); if(a){ a.scrollIntoView({block:"center"}); a.focus(); } }; });
    $$("[data-ib-del]",box).forEach(function(b){ b.onclick=function(){ if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="정말 지울까요?"; return; } IB.remove(b.dataset.ibDel).then(function(){ toast("질문을 지웠어요"); },function(){ toast("지우지 못했어요"); }); }; });
  }
  inboxOff=IB.on(function(){ if($("#inboxBox")) draw(); else if(inboxOff){ inboxOff(); inboxOff=null; } });
  draw();
}

function copy(txt){
  if(!txt) return;
  function fb(){ var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("복사했어요"); }catch(e){ toast("복사하지 못했어요"); } document.body.removeChild(ta); }
  try{ navigator.clipboard.writeText(txt).then(function(){ toast("복사했어요"); },fb); }catch(e){ fb(); }
}
