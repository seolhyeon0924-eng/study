<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>마음별 심리검사</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="common.css">
<style>
/* 마음별 메인 — common.css 위에 이 페이지 전용 요소만 */
html{scroll-padding-top:72px}
.wrap{max-width:1120px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
.narrow{max-width:780px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.center{text-align:center}
.note{font-size:14px;color:var(--ink2)}
.mute{color:var(--mute)}
.help{font-size:13px;color:var(--mute);margin-top:4px}
.cite{font-size:12.5px;color:var(--mute);line-height:1.6}
.pill{display:inline-flex;align-items:center;padding:1px 9px;border-radius:999px;font-size:12px;font-weight:650;background:var(--mist);color:var(--ink2);white-space:nowrap;border:1px solid var(--line)}
.pill.ok{background:#E5F1EB;border-color:#C7E0D2;color:#1F6B54}
.pill.wait{background:#F6EEDC;border-color:#E9DAB5;color:#875D10}

/* ---------- 홈: 오늘 줄 ---------- */
.dateline{display:flex;align-items:baseline;gap:16px;padding:18px 0;border-bottom:1px solid var(--line);font-size:14px;color:var(--ink2)}
.dateline time{font-family:var(--serif);font-weight:800;color:var(--ink);white-space:nowrap}
.dateline button{flex:1;min-width:0;text-align:left;background:none;border:0;padding:0;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dateline button b{color:var(--ink);font-weight:650;margin-right:6px}
@media (max-width:560px){.dateline{flex-direction:column;gap:2px}.dateline button{white-space:normal}}

/* ---------- 홈: 대표 검사 ---------- */
.feature{display:grid;gap:28px 48px;align-items:center;padding:40px 0 48px;border-bottom:1px solid var(--line)}
@media (min-width:860px){.feature{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr)}}
.feature-plate{display:block;padding:0;border:0;background:none;border-radius:var(--r-s)}
.feature-plate .plate{aspect-ratio:4/3}
.feature-copy h1{font-family:var(--serif);font-weight:800;font-size:clamp(30px,4.4vw,44px);line-height:1.28;letter-spacing:-.035em}
.feature-copy .by{display:block;font-size:15px;font-weight:650;color:var(--blue);margin-bottom:14px}
.feature-copy p{margin-top:16px;color:var(--ink2);font-size:16.5px;max-width:30em}
.specs{display:flex;flex-wrap:wrap;gap:0;margin:22px 0 26px;padding:0;list-style:none;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.specs li{flex:1 1 0;min-width:84px;padding:10px 14px 10px 0;font-size:13px;color:var(--mute);line-height:1.4}
.specs li + li{padding-left:14px;border-left:1px solid var(--line)}
.specs b{display:block;font-size:16px;color:var(--ink);font-weight:650}

/* ---------- 홈: 본문 + 옆단 ---------- */
.mag{display:grid;gap:48px;padding-top:44px}
@media (min-width:960px){.mag{grid-template-columns:minmax(0,1fr) 300px;gap:56px}}
.mag-main{display:flex;flex-direction:column;gap:56px;min-width:0}
.heading{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-bottom:12px;margin-bottom:22px;border-bottom:0}
.heading h2{font-family:var(--serif);font-weight:800;font-size:26px;letter-spacing:-.03em}
.heading p{font-size:14px;color:var(--mute)}
.posts{display:grid;gap:36px 28px;grid-template-columns:repeat(2,minmax(0,1fr))}
.posts.three{grid-template-columns:repeat(3,minmax(0,1fr));gap:28px 20px}
@media (max-width:700px){
  .posts,.posts.three{grid-template-columns:1fr;gap:22px}
  .post{display:grid;grid-template-columns:128px minmax(0,1fr);gap:14px;align-items:start}
  .post h3,.posts.three .post h3{font-size:16.5px}
  .post p{font-size:14px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
  .post .metaln{margin-top:6px}
}
.post{display:flex;flex-direction:column;gap:14px;text-align:left;background:none;border:0;padding:0;color:inherit;min-width:0}
.post h3{font-size:19px;font-weight:700;letter-spacing:-.025em}
.posts.three .post h3{font-size:17px}
.post p{margin-top:4px;font-size:14.5px;color:var(--ink2);line-height:1.65}
.post .metaln{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:10px;font-size:13px;color:var(--mute)}
.post .metaln .st{color:var(--blue);font-weight:650}
.post .metaln .st.done{color:#1F6B54}
@media (hover:hover){button.post:hover h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}}
.post.soon{cursor:default}
.post.soon h3,.post.soon p{color:var(--mute)}

.side{display:flex;flex-direction:column;gap:36px;min-width:0}
.side-h{display:flex;justify-content:space-between;align-items:baseline;padding-bottom:10px;margin-bottom:6px;border-bottom:0}
.side-h h2{font-family:var(--serif);font-weight:800;font-size:19px}
.side-h button{background:none;border:0;padding:0;font-size:13px;color:var(--ink2)}
.consult-box{background:var(--blue);color:#fff;border-radius:var(--r-m);padding:24px 22px}
.consult-box h2{font-family:var(--serif);font-weight:800;font-size:23px;letter-spacing:-.03em}
.consult-box p{margin-top:8px;font-size:14px;color:#D8E0F5}
.consult-box ul{list-style:none;margin:16px 0 20px;padding:0;font-size:14px}
.consult-box li{padding:9px 0;border-top:1px solid rgba(255,255,255,.18);display:flex;justify-content:space-between;gap:10px}
.consult-box li span{color:#C3CDEB;font-size:13px}
.consult-box .btn{width:100%;background:#fff;color:var(--blue-d)}
@media (hover:hover){.consult-box .btn:hover{background:var(--blue-t)}}
.qbox{border-top:1px solid var(--line);padding-top:4px}
.qbox p{font-family:var(--serif);font-weight:800;font-size:19px;line-height:1.55;letter-spacing:-.02em;margin:10px 0}
.qbox small{font-size:13px;color:var(--mute);line-height:1.6;display:block}
.kws{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.kws button{border:1.5px solid var(--line2);background:#fff;border-radius:999px;padding:5px 13px;font-size:13.5px;color:var(--ink2)}
@media (hover:hover){.kws button:hover{border-color:var(--ink);color:var(--ink)}}
.side-list{list-style:none;margin:0;padding:0}
.side-list li + li{border-top:1px solid var(--line)}
.side-list button{display:block;width:100%;text-align:left;background:none;border:0;padding:12px 0}
.side-list b{display:block;font-size:14.5px;font-weight:600;line-height:1.5}
.side-list span{font-size:12.5px;color:var(--mute)}

/* ---------- 안쪽 페이지 머리 ---------- */
.sec{padding-block:48px 8px}
.stitle{padding-bottom:16px;margin-bottom:28px;border-bottom:0}
.stitle h2{font-family:var(--serif);font-weight:800;font-size:clamp(28px,4vw,36px);letter-spacing:-.035em}
.stitle p{margin-top:6px;color:var(--ink2);font-size:15px}
.crumb{padding:22px 0 0;font-size:13.5px;color:var(--mute)}
.crumb button{background:none;border:0;padding:0;color:var(--ink2);text-decoration:underline;text-underline-offset:3px}

/* 검사 목록 카드 */
.grid{display:grid;gap:36px 24px;grid-template-columns:repeat(auto-fill,minmax(240px,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:820px){.grid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:540px){.grid.three{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:14px;text-align:left;background:none;border:0;padding:0;color:inherit;text-decoration:none;min-width:0}
.card .body{display:flex;flex-direction:column;gap:6px;flex:1}
.card .kind{font-size:13px;font-weight:650;color:var(--blue)}
.card h3{font-size:18px;font-weight:700;letter-spacing:-.025em}
.card p{font-size:14.5px;color:var(--ink2);line-height:1.65}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
@media (hover:hover){button.card:hover h3,a.card:hover h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}}
.card.soon h3,.card.soon p{color:var(--mute)}
.card.soon .kind{color:var(--mute)}

.consult-band{display:grid;gap:18px 32px;align-items:center;background:var(--mist);border-radius:var(--r-m);padding:28px}
@media (min-width:760px){.consult-band{grid-template-columns:1fr auto}}
.consult-band h3{font-family:var(--serif);font-weight:800;font-size:22px}
.consult-band ul{margin:10px 0 0;padding-left:18px;color:var(--ink2);font-size:14.5px}

/* ---------- 공지 ---------- */
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px}
.chip{border:1.5px solid var(--line2);background:#fff;color:var(--ink2);border-radius:999px;padding:5px 15px;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.list{display:flex;flex-direction:column}
.item{display:grid;grid-template-columns:132px 1fr;gap:20px;align-items:center;background:none;border:0;border-bottom:1px solid var(--line);padding:16px 0;text-align:left;width:100%;color:inherit}
.list .item:first-child{border-top:1px solid var(--line)}
.item .tag{font-size:12.5px;font-weight:650;color:var(--blue)}
.item h3{font-size:17px;font-weight:650;margin-top:2px}
.item time{display:block;font-size:13px;color:var(--mute);margin-top:2px}
@media (hover:hover){button.item:hover h3{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}}
@media (max-width:520px){.item{grid-template-columns:92px 1fr;gap:14px}}
.empty{border:1px dashed var(--line2);border-radius:var(--r-m);padding:36px 20px;text-align:center;color:var(--ink2);display:flex;flex-direction:column;align-items:center;gap:12px;font-size:15px}
.article{border-top:0}
.article-h{padding:22px 0 18px;border-bottom:1px solid var(--line)}
.article-h .cat{font-size:13px;font-weight:650;color:var(--blue)}
.article-h h1{font-family:var(--serif);font-weight:800;font-size:clamp(24px,4vw,32px);margin:4px 0 6px;letter-spacing:-.03em}
.article-h time{font-size:13px;color:var(--mute)}
.article-b{padding:24px 0 8px;white-space:pre-wrap;font-size:16px;line-height:1.9}

/* ---------- 검사 소개 ---------- */
.about{display:grid;gap:28px;padding:20px 0 64px}
@media (min-width:900px){.about{grid-template-columns:minmax(0,1fr) 320px;gap:48px;align-items:start}.about-side{position:sticky;top:20px}}
.about-main{display:flex;flex-direction:column;gap:0;min-width:0}
.about-hero{display:grid;gap:22px;align-items:end;padding-bottom:28px;border-bottom:0}
@media (min-width:640px){.about-hero{grid-template-columns:260px 1fr}}
.about-hero .kind{font-size:14px;font-weight:650;color:var(--blue)}
.about-hero h1{font-family:var(--serif);font-weight:800;font-size:clamp(28px,4.2vw,40px);letter-spacing:-.035em;margin:2px 0 4px}
.about-main > section{padding:28px 0;border-bottom:1px solid var(--line)}
.about-main > section h2{font-family:var(--serif);font-weight:800;font-size:21px;margin-bottom:12px}
.about-main > section p + p{margin-top:10px}
.about-main > section p{color:var(--ink2)}
.about-main ul{margin:0;padding-left:20px;color:var(--ink2)}
.about-main li + li{margin-top:6px}
.domains{display:grid;gap:0;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));border-top:1px solid var(--line)}
.domains div{padding:12px 14px 12px 0;border-bottom:1px solid var(--line)}
.domains b{display:block;font-size:15.5px}
.domains span{font-size:14px;color:var(--ink2)}
.about-side .panel{border:1px solid var(--line);border-radius:var(--r-m);padding:20px}
.about-side .panel + .panel{margin-top:14px}
.about-side h2{font-family:var(--serif);font-weight:800;font-size:18px}
.about-side .acts{display:flex;flex-direction:column;gap:8px}
.kv{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
.kv th{text-align:left;font-weight:600;color:var(--mute);padding:9px 12px 9px 0;vertical-align:top;white-space:nowrap;width:1%}
.kv td{padding:9px 0;color:var(--ink)}
.kv tr + tr th,.kv tr + tr td{border-top:1px solid var(--line)}

/* ---------- 동의 ---------- */
.consent{max-width:720px;margin:0 auto;padding:28px 0 64px}
.flow{display:flex;gap:0;margin-bottom:28px;counter-reset:f;border-bottom:1px solid var(--line)}
.flow span{flex:1;counter-increment:f;padding:0 0 12px;font-size:13.5px;color:var(--mute);position:relative}
.flow span::before{content:counter(f) ". ";}
.flow span.on{color:var(--ink);font-weight:650}
.flow span.on::after{content:"";position:absolute;left:0;right:12px;bottom:-1px;height:2px;background:var(--blue)}
@media (max-width:520px){.flow span{font-size:12px}}
.page-h{display:flex;flex-direction:column;gap:8px;padding:36px 0 20px}
.page-h h1{font-family:var(--serif);font-weight:800;font-size:clamp(26px,4.4vw,36px);letter-spacing:-.035em}
.page-h p{color:var(--ink2);max-width:38em}
.consent .page-h{padding-top:0}
.consent .form{margin-top:12px}
.seg{display:flex;flex-wrap:wrap;gap:8px}
.seg label{position:relative;cursor:pointer}
.seg input{position:absolute;opacity:0;width:1px;height:1px}
.seg span{display:block;border:1.5px solid var(--line2);border-radius:var(--r-s);padding:9px 16px;font-size:14.5px;background:#fff}
.seg input:checked + span{border-color:var(--blue);background:var(--blue-t);color:var(--blue-d);font-weight:650}
.seg input:focus-visible + span{outline:2px solid var(--blue);outline-offset:2px}
.terms{max-height:220px;overflow:auto;border:1px solid var(--line);border-radius:var(--r-s);padding:14px 16px;background:var(--mist);font-size:13.5px;color:var(--ink2)}
.terms h4{font-size:14px;color:var(--ink);margin:10px 0 4px}
.terms h4:first-child{margin-top:0}
.terms ul{margin:0;padding-left:18px}

/* ---------- 문항 ---------- */
.qbar{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.qbar .wrap{display:flex;align-items:center;gap:14px;height:54px}
.qbar b{font-size:14px;font-weight:650;white-space:nowrap}
.track{flex:1;height:4px;background:var(--mist2);overflow:hidden;border-radius:2px}
.track i{display:block;height:100%;width:0;background:var(--coral);transition:width .3s}
.qcard{border-bottom:1px solid var(--line);padding:30px 0 28px;transition:opacity .2s}
.qcard.done{opacity:.5}
.qcard.done:focus-within{opacity:1}
@media (hover:hover){.qcard.done:hover{opacity:1}}
.qcard.flag{background:linear-gradient(90deg,var(--warn-t),transparent 70%);box-shadow:inset 3px 0 0 var(--warn);padding-left:16px}
.qn{font-size:13px;font-weight:650;color:var(--mute)}
.qt{font-family:var(--serif);font-weight:800;font-size:clamp(19px,3.4vw,22px);margin:4px 0 20px;line-height:1.5;letter-spacing:-.02em}
.likert{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;max-width:560px}
.lk{display:flex;flex-direction:column;align-items:center;gap:8px;background:none;border:0;padding:4px 0;-webkit-tap-highlight-color:transparent}
.lk i{display:block;width:100%;height:42px;border-radius:var(--r-s);border:1.5px solid var(--line2);background:#fff;transition:background-color .15s,border-color .15s}
.lk span{font-size:12.5px;color:var(--ink2);line-height:1.25;text-align:center}
.lk[aria-checked="true"] i{background:var(--coral);border-color:var(--coral)}
.lk[aria-checked="true"] span{color:var(--ink);font-weight:650}
@media (hover:hover){.lk:hover i{border-color:var(--ink)}}
.pager{display:flex;justify-content:space-between;align-items:center;gap:10px;margin:28px 0 64px}
.pager .msg{flex:1;text-align:center;color:var(--warn);font-size:14px;font-weight:600}

.sct-q{border-bottom:1px solid var(--line);padding:22px 0}
.sct-q label{display:flex;gap:12px;font-family:var(--serif);font-weight:800;font-size:19px;line-height:1.5;letter-spacing:-.02em}
.sct-q label b{flex:none;font-family:var(--sans);color:var(--mute);font-size:14px;font-weight:600;min-width:30px;padding-top:4px}
.sct-q textarea{display:block;width:100%;margin:10px 0 0;min-height:52px;resize:vertical;border:0;border-bottom:1.5px solid var(--line2);border-radius:0;padding:8px 2px;background:transparent;font-size:16px;line-height:1.6}
.sct-q textarea:focus{outline:none;border-bottom-color:var(--blue);background:var(--blue-t)}
.sct-q.filled textarea{border-bottom-color:var(--ink)}
.sct-q .tail{display:block;margin-top:6px;color:var(--ink2);font-size:14.5px;padding-left:42px}
@media (min-width:600px){.sct-q textarea{margin-left:42px;width:calc(100% - 42px)}}

/* ---------- HTP ---------- */
.steps{display:flex;gap:6px;margin:16px 0 4px;flex-wrap:wrap}
.steps span{padding:5px 13px;border-radius:999px;border:1px solid var(--line);font-size:13.5px;font-weight:600;color:var(--mute)}
.steps span.on{background:var(--pri);border-color:var(--pri);color:#fff}
.steps span.done{color:var(--ink);border-color:var(--line2)}
.board{border:1px solid var(--line);border-radius:var(--r-m);padding:12px;background:var(--mist)}
.tools{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.tool{display:inline-flex;align-items:center;gap:6px;min-height:38px;padding:0 12px;border-radius:var(--r-s);border:1.5px solid var(--line2);background:#fff;font-size:14px;font-weight:600}
.tool[aria-pressed="true"]{background:var(--pri);border-color:var(--pri);color:#fff}
.tool svg{width:18px;height:18px}
.tools .sp{flex:1}
.canvas-wrap{position:relative;margin:0 auto;overflow:hidden;background:#fff;border:1.5px solid var(--line2);touch-action:none}
.canvas-wrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}
.canvas-wrap .hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--line2);font-family:var(--serif);font-size:19px;pointer-events:none;text-align:center;padding:20px}
.box{border:1px solid var(--line);border-radius:var(--r-m);padding:22px}
.box + .box{margin-top:16px}
.qa{display:flex;flex-direction:column;gap:14px}
.qa label{font-weight:650}

/* ---------- 입력 공통 ---------- */
.form{display:flex;flex-direction:column;gap:22px}
.form .f > label,.form fieldset legend{display:block;font-weight:650;margin-bottom:8px;font-size:15px}
.form fieldset{border:0;margin:0;padding:0;min-width:0}
.form textarea{min-height:150px;resize:vertical}
.qa textarea,.form input:not([type=checkbox]):not([type=radio]),.form textarea,.form select,.modal-box input{display:block;width:100%;border:1.5px solid var(--line2);border-radius:var(--r-s);padding:11px 13px;background:#fff;font-size:16px}
.qa textarea{min-height:56px;margin-top:6px;resize:vertical}
.qa textarea:focus,.form input:focus,.form textarea:focus,.form select:focus,.modal-box input:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-t)}
.opts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.opt{position:relative;display:block;cursor:pointer}
.opt input{position:absolute;opacity:0;width:1px;height:1px}
.opt span{display:flex;flex-direction:column;gap:2px;height:100%;border:1.5px solid var(--line2);border-radius:var(--r-s);padding:13px 15px;background:#fff}
.opt span b{font-size:15px}
.opt span small{font-size:13px;color:var(--ink2);line-height:1.5}
.opt input:checked + span{border-color:var(--blue);background:var(--blue-t);box-shadow:inset 0 0 0 1px var(--blue)}
.opt input:focus-visible + span{outline:2px solid var(--blue);outline-offset:2px}
.opt input:disabled + span{opacity:.45}
.check{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.6}
.check input{width:19px;height:19px;margin-top:3px;accent-color:var(--blue);flex:none}
.err{color:var(--warn);font-weight:600;font-size:14px;min-height:1.4em}
.err:empty{min-height:0}
.facts{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}

.consult-band h3{font-weight:800}
.about{padding-top:24px}
.about-hero{background:var(--card);border-radius:var(--r-l);padding:18px;align-items:center}
.about-hero .plate{border-radius:var(--r-m)}
.about-hero .kind{color:var(--blue);font-weight:700}
.about-hero h1{font-weight:800;letter-spacing:-.05em}
.about-main > section{border-bottom:1px solid var(--line)}
.about-main > section h2,.guide > section h2{font-weight:800;letter-spacing:-.04em}
.about-side .panel{background:var(--card);border:0;border-radius:var(--r-l)}
.about-side h2{font-weight:800}
.domains,.look{border-top:0;gap:8px}
.domains div,.look div{background:var(--card);border:0;border-radius:var(--r-m);padding:14px 16px}
.crumb button{color:var(--mute);text-decoration:none;font-weight:600}
.page-h h1{font-weight:800;letter-spacing:-.05em}

/* 동의·폼 */
.flow{border:0;gap:6px}
.flow span{flex:1;background:var(--card);border-radius:999px;padding:8px 10px;text-align:center;font-size:13px;font-weight:600}
.flow span.on{background:var(--ink);color:#fff}
.flow span.on::after{display:none}
#cs,#cf,#nf,#ghF,#df,#af{background:var(--card);border:0;border-radius:var(--r-l);padding:28px}
@media (max-width:560px){#cs,#cf,#nf,#ghF,#df,#af{padding:20px 16px}}
.qa textarea,.form input:not([type=checkbox]):not([type=radio]),.form textarea,.form select,.modal-box input{border:0;border-radius:var(--r-s);background:#fff;padding:13px 15px}
.qa textarea:focus,.form input:focus,.form textarea:focus,.form select:focus,.modal-box input:focus{box-shadow:0 0 0 2px var(--peri)}
.modal-box input{background:var(--card)}
.form .f > label,.form fieldset legend{font-weight:700}
.terms{border:0;border-radius:var(--r-m);background:#fff}
.seg span{border:0;border-radius:999px;background:#fff;font-weight:600}
.seg input:checked + span{background:var(--ink);color:#fff}
.opt span{border:0;border-radius:var(--r-m);background:#fff}
.opt input:checked + span{background:var(--ink);color:#fff;box-shadow:none}
.opt input:checked + span small{color:#C9CBD6}
.check input{accent-color:var(--ink)}
.facts span{background:#fff;border:0;color:var(--ink2)}
.setup-note{border-left:0;border-radius:var(--r-m)}
.ok-box{background:var(--card);border:0;border-radius:var(--r-l);padding:32px;margin-top:20px}
.ok-box h2{font-weight:800}

/* 문항 */
.qbar{background:rgba(255,255,255,.94);border-bottom:0}
.track{height:6px;border-radius:999px;background:var(--mist2)}
.track i{border-radius:999px;background:linear-gradient(90deg,#B7A8FF,#FFB8D1)}
.qcard{background:var(--card);border:0;border-radius:var(--r-l);padding:26px 26px 24px;margin-top:12px}
.qcard.done{opacity:.55}
.qcard.flag{background:var(--card);box-shadow:inset 0 0 0 2px var(--warn);padding-left:26px}
.qt{font-weight:800;letter-spacing:-.035em}
.lk i{border:0;background:#fff;border-radius:999px;height:42px}
.lk[aria-checked="true"] i{background:var(--ink)}
@media (hover:hover){.lk:hover i{box-shadow:inset 0 0 0 2px var(--ink2)}}
.sct-q{background:var(--card);border:0;border-radius:var(--r-l);padding:22px 24px;margin-top:12px}
.sct-q label{font-weight:700}
.sct-q textarea{background:#fff;border:0;border-radius:var(--r-s);padding:12px 14px}
.sct-q textarea:focus{box-shadow:0 0 0 2px var(--peri)}
.sct-q.filled textarea{background:#fff}
.board,.box{background:var(--card);border:0;border-radius:var(--r-l)}
.tool{border:0;background:#fff;border-radius:999px}
.tool[aria-pressed="true"]{background:var(--ink);color:#fff}
.steps span{border:0;background:var(--card)}
.steps span.on{background:var(--ink);color:#fff}
.steps span.done{background:var(--mist2)}
.canvas-wrap{border-radius:var(--r-s);border:0}

/* 보고서 */
.report{border:0;border-radius:0;overflow:visible}
.report-h{position:relative;overflow:hidden;border-radius:var(--r-l);background:#F7F6FF;color:var(--ink);padding:34px 30px}
.report-h::before{content:"";position:absolute;width:300px;height:300px;right:-60px;top:-120px;border-radius:50%;background:#B7A8FF;filter:blur(50px);opacity:.75}
.report-h::after{content:"";position:absolute;width:220px;height:220px;right:180px;top:20px;border-radius:50%;background:#FFB8D1;filter:blur(50px);opacity:.6}
.report-h > *{position:relative;z-index:1}
.report-h b{font-weight:800;font-size:clamp(22px,3.6vw,30px);letter-spacing:-.045em}
.report-h span{color:var(--ink2)}
.report-b{padding:12px 4px 0}
.report-b > div{border-bottom:1px solid var(--line)}
.report-b h2{font-weight:800;letter-spacing:-.04em;font-size:21px}
.meta-grid{border:0;gap:6px}
.meta-grid div{background:var(--card);border:0;border-radius:var(--r-s)}
.caution{background:var(--card);border-radius:var(--r-m)}
.reflect li::before{font-weight:800;color:var(--blue)}
.traits span{border:0;background:var(--card)}

/* 이용 안내 · 내 신청 */
.guide > section{background:none;padding:6px 0 30px}
.proc{gap:10px;border:0}
.proc div{background:var(--card);border:0;border-radius:var(--r-m);padding:18px}
.proc div::before{font-weight:800;color:var(--blue)}
.faq details{border-color:var(--line2)}
.req{background:var(--card);border:0;border-radius:var(--r-l);padding:20px 22px;margin-top:10px}
.req:last-of-type{border-bottom:0}
.req .msg{background:#fff;border-radius:var(--r-s)}
.modal{background:rgba(25,27,36,.4)}
.modal-box{border-radius:26px}
.toast{border-radius:999px;background:var(--ink)}
.gallery img{border-radius:var(--r-m);border:0}
</style>
</head>

/* ---------- SHA-256 (관리자 코드 확인용) ---------- */
function sha256hex(str){
  function rr(n,x){return (x>>>n)|(x<<(32-n));}
  var K=[],H=[],i,j,p=2;
  function isP(n){for(var f=2;f*f<=n;f++) if(n%f===0) return false; return true;}
  for(i=0;i<64;p++){ if(isP(p)){ if(i<8) H[i]=(Math.pow(p,1/2)*4294967296)|0; K[i]=(Math.pow(p,1/3)*4294967296)|0; i++; } }
  var bytes=unescape(encodeURIComponent(str)), l=bytes.length, words=[];
  for(i=0;i<l;i++) words[i>>2]|=(bytes.charCodeAt(i)&255)<<(24-(i%4)*8);
  words[l>>2]|=0x80<<(24-(l%4)*8); words[((l+8)>>6<<4)+15]=l*8;
  for(j=0;j<words.length;j+=16){
    var w=[], a=H[0],b=H[1],c=H[2],d=H[3],e=H[4],f=H[5],g=H[6],h=H[7];
    for(i=0;i<64;i++){
      if(i<16) w[i]=words[j+i]|0;
      else { var s0=rr(7,w[i-15])^rr(18,w[i-15])^(w[i-15]>>>3), s1=rr(17,w[i-2])^rr(19,w[i-2])^(w[i-2]>>>10); w[i]=(w[i-16]+s0+w[i-7]+s1)|0; }
      var t1=(h+(rr(6,e)^rr(11,e)^rr(25,e))+((e&f)^(~e&g))+K[i]+w[i])|0, t2=((rr(2,a)^rr(13,a)^rr(22,a))+((a&b)^(a&c)^(b&c)))|0;
      h=g; g=f; f=e; e=(d+t1)|0; d=c; c=b; b=a; a=(t1+t2)|0;
    }
    H[0]=(H[0]+a)|0; H[1]=(H[1]+b)|0; H[2]=(H[2]+c)|0; H[3]=(H[3]+d)|0; H[4]=(H[4]+e)|0; H[5]=(H[5]+f)|0; H[6]=(H[6]+g)|0; H[7]=(H[7]+h)|0;
  }
  return H.map(function(x){ return ("00000000"+(x>>>0).toString(16)).slice(-8); }).join("");
}

function viewSctIntro(v){
  var key="sct-"+v, s=sctState(v), n=s.ans.filter(function(x){return x&&x.trim();}).length, total=SCT[v].items.length;
  viewAbout(key, sideActions(key, s.done?'<button class="btn btn-main" type="button" data-nav="'+key+'-result">결과 보고서 보기</button><button class="btn btn-line" type="button" data-nav="'+key+'-test">문장 고치기</button><button class="btn btn-line" type="button" id="sctnew">새로 쓰기</button>'
    : n?'<button class="btn btn-main" type="button" data-nav="'+key+'-test">이어서 쓰기 ('+n+'/'+total+')</button><button class="btn btn-line" type="button" id="sctnew">처음부터</button>'
    : '<button class="btn btn-main" type="button" data-nav="'+key+'-start">검사 시작하기</button>'));
  var nb=$("#sctnew"); if(nb) nb.onclick=function(){ store("mb.sct."+v,null); go(key+"-start"); };
}
function viewSctResult(v){
  var key="sct-"+v, D=SCT[v], s=store("mb.sct."+v); if(!s||!s.done){ go(key); return; }
  var info=testInfo(key), total=D.items.length, filled=s.ans.filter(function(x){return x&&x.trim();}).length;
  var groups={}; D.areas.forEach(function(a){ (groups[a.g]=groups[a.g]||[]).push(a); });
  function line(n){ var i=-1; for(var k=0;k<D.items.length;k++){ if(itemNo(v,k)===String(n)){ i=k; break; } } if(i<0) return ""; var a=s.ans[i]; return '<li><span class="stem">'+itemNo(v,i)+'. '+esc(D.items[i].t)+'</span> <span class="ans'+(a&&a.trim()?'':' blank')+'">'+(a&&a.trim()?esc(a):'(비워 둠)')+'</span>'+(D.items[i].tail?' <span class="stem">'+esc(D.items[i].tail)+'</span>':'')+'</li>'; }
  var areaHtml=Object.keys(groups).map(function(g){
    return '<h3 class="grp">'+g+'</h3>'+groups[g].map(function(a){
      var nums=a.i.slice(); if(v==="teen"&&a.i.indexOf(38)>-1){ nums=nums.filter(function(x){return x!==38;}).concat(["38-1","38-2","38-3"]); }
      var empty=nums.filter(function(n){ var i=-1; for(var k=0;k<D.items.length;k++) if(itemNo(v,k)===String(n)) i=k; return i>-1 && !(s.ans[i]&&s.ans[i].trim()); }).length;
      return '<div class="area"><h3><span class="pill">'+a.n+'</span>'+(empty?'<span class="note" style="font-weight:500">비워 둔 문장 '+empty+'개</span>':'')+'</h3><ul>'+nums.map(line).join("")+'</ul></div>'; }).join("");
  }).join("");
  setView('<div class="wrap narrow"><p class="crumb"><button type="button" data-nav="'+key+'">'+D.name+'</button> › 결과 보고서</p>'+
    '<section class="report"><div class="report-h"><b>'+D.name+' 응답 보고서</b><span>마음별 심리검사 · '+fmtDate(s.date)+'</span></div><div class="report-b">'+
    '<div><h2>검사 정보</h2>'+reportMeta([["검사명",INFO[key].full],["실시일",fmtDate(s.date)],["연령대",info.age||"-"],["성별",info.gender||"-"],["작성 문장",filled+" / "+total],["소요 시간",dur(info.startedAt,s.date)]])+'</div>'+
    '<div><h2>해석 안내</h2><p class="summary">문장완성검사는 점수를 매기지 않아요. 아래처럼 영역별로 모은 문장을 상담자가 함께 읽으며 <b>반복되는 인물과 주제</b>, <b>감정의 색깔</b>, <b>비워 두거나 짧게 쓴 문장</b>을 살펴봐요. '+(total-filled?'비워 둔 문장은 '+(total-filled)+'개예요. 쓰기 어려웠던 문장도 해석에서 중요한 단서가 돼요.':'모든 문장을 채웠어요.')+'</p></div>'+
    '<div><h2>스스로 먼저 읽어 보기</h2><ol class="reflect"><li>여러 문장에 되풀이해서 나오는 사람이나 단어가 있나요?</li><li>쓰기 어려웠거나 오래 멈췄던 문장은 어느 것이었나요?</li><li>가장 마음이 따뜻해지는 문장과 가장 무거운 문장을 하나씩 골라 보세요.</li></ol></div>'+
    '<div><h2>영역별 응답</h2>'+areaHtml+'</div>'+
    '<div class="crisis">쓰다가 힘든 기억이나 감정이 올라왔다면 잠시 쉬어도 괜찮아요. 위급할 때는 자살예방 상담전화 <b>109</b>, 정신건강 위기상담 <b>1577-0199</b>로 언제든 연락할 수 있어요.</div>'+
    caution(key)+'</div></section>'+
    '<div class="row" style="justify-content:center;margin:24px 0 16px"><button class="btn btn-main" type="button" data-nav="consult">이 문장으로 해석 상담 신청</button><button class="btn btn-line" type="button" data-nav="'+key+'-test">문장 고치기</button><button class="btn btn-line" type="button" id="sctcopy">전체 복사</button></div>'+
    '<p class="center" style="margin-bottom:56px"><button class="btn btn-danger btn-sm" type="button" id="sctclear">이 브라우저에서 기록 지우기</button></p></div>');
  $("#sctcopy").onclick=function(){ copy(sctText(v)); };
  $("#sctclear").onclick=function(){ store("mb.sct."+v,null); store("mb.info."+key,null); toast("문장완성검사 기록을 지웠어요"); go("tests"); };
}

/* ================================================================
   다른 검사 결과 읽기 (같은 사이트의 이고그램·사랑의 삼각형)
   ================================================================ */
function egoScores(){ var s=store("egogram.web.v1"); if(!s||!Array.isArray(s.answers)||s.answers.some(function(x){return x===null;})) return null; var o={}; Object.keys(EGO_ITEMS).forEach(function(k){ o[k]=EGO_ITEMS[k].reduce(function(t,n){return t+(s.answers[n-1]||0);},0); }); return o; }
function loveScores(){ var s=store("sternberg-love-v2"); if(!s||!Array.isArray(s.answers)||s.answers.some(function(x){return x==null;})) return null; var r=[0,1,2].map(function(k){ var a=s.answers.slice(k*15,k*15+15); return Math.round(a.reduce(function(x,y){return x+y;},0)/15*10)/10; }); return {int:r[0],pas:r[1],com:r[2],target:s.target}; }

  var h=store("mb.htp"); if(h&&h.done) o.push({k:"htp",label:"HTP 그림검사 (그림 3장)",date:h.date,text:"[HTP 그림검사 "+fmtDate(h.date)+"]\n"+HTP.map(function(d){ var x=h[d.k]||{}; return "■ "+d.n+" (그린 시간 "+fmtSec(x.sec)+")\n"+d.q.map(function(q,i){ return "- "+q+" "+((x.qa&&x.qa[i])||"(비워 둠)"); }).join("\n"); }).join("\n"),imgs:true});
  var e=egoScores(); if(e) o.push({k:"ego",label:"이고그램 검사",text:"[이고그램]\n"+Object.keys(e).map(function(k){return k+" "+e[k]+"점";}).join(" · ")+" (각 30점 만점)"});

}

function b64e(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64d(s){ return decodeURIComponent(escape(atob(String(s).replace(/\s/g,"")))); }
async function ghFetchNotices(c){
  var url="https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/notices.json?ref="+encodeURIComponent(c.branch||"main");
  var r=await fetch(url,{headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"},cache:"no-store"});
  if(r.status===404) return {sha:null,list:[]};
  if(!r.ok) throw {status:r.status};
  var j=await r.json(), d=JSON.parse(b64d(j.content)||"[]");
  return {sha:j.sha,list:Array.isArray(d)?d:(d.notices||[])};
}
async function ghSaveNotices(c,list,sha,msg){
  var url="https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/notices.json";
  var body={message:msg,content:b64e(JSON.stringify({notices:list},null,2)+"\n"),branch:c.branch||"main"}; if(sha) body.sha=sha;
  var r=await fetch(url,{method:"PUT",headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw {status:r.status};
}
function ghErr(e){ var s=e&&e.status; return s===401?"토큰이 맞지 않거나 만료됐어요. 연결 설정에서 토큰을 다시 넣어 주세요.":s===403?"토큰에 저장소 쓰기 권한이 없어요. Contents 권한을 Read and write로 만들어 주세요.":s===404?"저장소를 찾지 못했어요. 사용자명과 저장소 이름을 확인해 주세요.":s===409?"다른 곳에서 먼저 공지가 바뀌었어요. 다시 눌러 주세요.":"GitHub에 저장하지 못했어요. 인터넷 연결을 확인해 주세요."; }

var diary=[], diaryState="loading", asks=[], askState="loading";
function loadList(file,key,done){
  fetch(file+"?t="+Date.now(),{cache:"no-store"}).then(function(r){ if(!r.ok) throw new Error("http"); return r.json(); })
    .then(function(d){ done(Array.isArray(d)?d:(d[key]||[]),"ok"); })
    .catch(function(){ done([],location.protocol==="file:"?"local":"ok"); });
}
function sortByDate(l){ return (l||[]).filter(Boolean).sort(function(a,b){ return (b.date||0)-(a.date||0); }); }
function initPersonal(){
  loadList("diary.json","posts",function(l,s){ diary=sortByDate(l); diaryState=s; refreshPersonal(); });
  loadList("asks.json","asks",function(l,s){ asks=l.filter(function(x){return x&&x.q&&x.a;}).sort(function(a,b){ return (b.aDate||0)-(a.aDate||0); }); askState=s; refreshPersonal(); });
}
function refreshPersonal(){
  if(current==="home"){ var a=$("#homeToday"), b=$("#homeAsk"), g=$("#heroChat"); if(a) a.innerHTML=homeToday(); if(b) b.innerHTML=homeAsk(); if(g) g.innerHTML=heroChat(); }
  if(current==="today") renderTodayList();

        '<p class="ask-note">답변한 질문만 이 페이지에 공개돼요. 이름, 연락처 같은 개인정보는 적지 말아 주세요. 지금 많이 힘들다면 기다리지 말고 <b>109</b>(자살예방 상담전화)에 연락해 주세요.</p>'+
        '<p class="err" id="askErr" role="alert"></p>'+
        '<div class="row"><span class="cnt" id="askCnt">0 / 500</span><button class="btn btn-main" type="submit"'+(can?'':' disabled')+'>질문 보내기</button></div>'+
        (can?'':'<p class="help">질문 받기가 아직 설정되지 않았어요.</p>')+
      '</form></div>'+
      '<div class="qa-list" id="qaList"></div>'+
    '</div><aside><div class="mine" id="mine"></div></aside></div>'+
  '</div></section>');
  var q=$("#askQ"); q.oninput=function(){ $("#askCnt").textContent=q.value.length+" / 500"; };
  $("#askF").onsubmit=async function(e){

    var btn=this.querySelector("button[type=submit]"); btn.disabled=true; err.textContent="보내는 중이에요…";
    try{
      var r=await fetch("https://api.web3forms.com/submit",{method:"POST",headers:{"Content-Type":"application/json",Accept:"application/json"},body:JSON.stringify({access_key:CFG.web3formsKey,subject:"[마음별 질문함] 새 질문이 왔어요",from_name:"마음별 질문함",botcheck:false,message:"새 질문\n\n"+text+"\n\n보낸 사람: "+(nick||"익명")+"\n질문 번호: "+id+"\n\n아래 링크를 누르면 관리자 화면에서 바로 답변을 쓸 수 있어요.\n"+link})});
      var j=await r.json().catch(function(){return {};});
      if(!r.ok||j.success===false) throw new Error("send");
      mine.unshift({id:id,q:text,nick:nick,date:Date.now()}); store("mb.asks",mine.slice(0,30));
      q.value=""; $("#askN").value=""; $("#askCnt").textContent="0 / 500"; err.textContent=""; toast("질문을 보냈어요"); renderAskLists();
    }catch(x){ err.textContent="질문을 보내지 못했어요. 인터넷 연결을 확인하고 다시 눌러 주세요."; }
    btn.disabled=false;
  };

var adminTab="notice", editingDiary=null, editingAsk=null, askPrefill=null;
async function ghGetList(c,file,key){
  var r=await fetch("https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/"+file+"?ref="+encodeURIComponent(c.branch||"main"),{headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"},cache:"no-store"});
  if(r.status===404) return {sha:null,list:[]};
  if(!r.ok) throw {status:r.status};
  var j=await r.json(), d=JSON.parse(b64d(j.content)||"[]");
  return {sha:j.sha,list:Array.isArray(d)?d:(d[key]||[])};
}
async function ghPutFile(c,path,b64,msg,sha){
  var body={message:msg,content:b64,branch:c.branch||"main"}; if(sha) body.sha=sha;
  var r=await fetch("https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/"+path,{method:"PUT",headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok) throw {status:r.status};
}
async function ghDeleteFile(c,path,msg){
  var g=await fetch("https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/"+path+"?ref="+encodeURIComponent(c.branch||"main"),{headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json"},cache:"no-store"});
  if(!g.ok) return;
  var j=await g.json();
  await fetch("https://api.github.com/repos/"+c.owner+"/"+c.repo+"/contents/"+path,{method:"DELETE",headers:{Authorization:"Bearer "+c.token,Accept:"application/vnd.github+json","Content-Type":"application/json"},body:JSON.stringify({message:msg,sha:j.sha,branch:c.branch||"main"})});
}
function wrapList(key,list){ var o={}; o[key]=list; return b64e(JSON.stringify(o,null,2)+"\n"); }
function shrinkImage(file,max,cb){
  var url=URL.createObjectURL(file), img=new Image();
  img.onload=function(){ var s=Math.min(1,max/Math.max(img.width,img.height)), cv=document.createElement("canvas"); cv.width=Math.round(img.width*s); cv.height=Math.round(img.height*s);
    var cx=cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height); URL.revokeObjectURL(url); cb(cv.toDataURL("image/jpeg",.85)); };
  img.onerror=function(){ URL.revokeObjectURL(url); cb(null); };
  img.src=url;
}
function ghReady(){ var c=gh(); return !!(c.owner&&c.repo&&c.token); }
function adminSaveNote(){ return ghReady()?'<p class="help">올린 내용은 사이트에 반영되기까지 1~2분 걸려요.</p>':'<p class="help">올리려면 먼저 위에서 GitHub을 연결해 주세요.</p>'; }
function todayISO(t){ var d=t?new Date(t):new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

function renderDiaryAdmin(el){
  var x=editingDiary?diary.filter(function(n){return n.id===editingDiary;})[0]:null, c=gh(), ready=ghReady(), photoData=null, dropPhoto=false;
  el.innerHTML='<form class="form" id="df" novalidate><h3 style="font-size:19px;font-weight:800">'+(x?'기록 고치기':'오늘의 기록 쓰기')+'</h3>'+
    '<div class="f"><label for="dT">제목</label><input id="dT" maxlength="80" value="'+esc(x?x.title:"")+'" placeholder="예) 시험 끝나고 친구들이랑 떡볶이"></div>'+
    '<div class="row" style="gap:14px;align-items:flex-start"><div class="f" style="flex:1;min-width:150px"><label for="dD">날짜</label><input id="dD" type="date" value="'+todayISO(x&&x.date)+'"></div>'+
    '<div class="f" style="flex:1;min-width:150px"><label for="dM">오늘 기분</label><select id="dM"><option value="">고르지 않음</option>'+MOODS.map(function(m){ return '<option'+(x&&x.mood===m?' selected':'')+'>'+m+'</option>'; }).join("")+'</select></div></div>'+
    '<div class="f"><label for="dB">내용</label><textarea id="dB" maxlength="5000" style="min-height:200px" placeholder="오늘은 이런 걸 했어요">'+esc(x?x.body:"")+'</textarea></div>'+
    '<div class="f"><label for="dP">사진 (선택)</label><input id="dP" type="file" accept="image/*"><p class="help">긴 쪽 1280px로 줄여서 올려요. 다른 사람 얼굴이 나온 사진은 동의를 받고 올려 주세요.</p><div class="ph-prev" id="dPrev">'+(x&&x.photo?'<img src="'+esc(x.photo)+'" alt=""><button class="btn btn-line btn-sm" type="button" id="dPx">사진 빼기</button>':'')+'</div></div>'+
    '<p class="err" id="dErr" role="alert"></p><div class="row"><button class="btn btn-main" type="submit"'+(ready?'':' disabled')+'>'+(x?'고친 기록 올리기':'기록 올리기')+'</button>'+(x?'<button class="btn btn-line" type="button" id="dNew">새로 쓰기</button><button class="btn btn-danger" type="button" id="dDel"'+(ready?'':' disabled')+'>삭제</button>':'')+'</div>'+adminSaveNote()+'</form>'+
    '<h3 style="font-size:17px;font-weight:800;margin:30px 0 10px">올린 기록 '+diary.length+'개</h3><div class="list">'+(diary.length?diary.map(function(n){ return '<button class="item" type="button" data-edit-d="'+n.id+'">'+diaryImg(n)+'<span><span class="tag">TODAY</span><h3>'+esc(n.title)+'</h3><time>'+fmtDate(n.date)+'</time></span></button>'; }).join(""):'<div class="empty">아직 올린 기록이 없어요.</div>')+'</div>';
  $$("[data-edit-d]").forEach(function(b){ b.onclick=function(){ editingDiary=b.dataset.editD; renderDiaryAdmin(el); window.scrollTo(0,0); }; });
  function bindPx(){ var px=$("#dPx"); if(px) px.onclick=function(){ photoData=null; dropPhoto=true; $("#dP").value=""; $("#dPrev").innerHTML=""; }; }
  bindPx();
  $("#dP").onchange=function(){ var f=this.files&&this.files[0]; if(!f) return; $("#dErr").textContent="사진을 줄이는 중…";
    shrinkImage(f,1280,function(data){ if(!data){ $("#dErr").textContent="이 사진은 열 수 없어요. 다른 사진을 골라 주세요."; return; } photoData=data; dropPhoto=false; $("#dErr").textContent=""; $("#dPrev").innerHTML='<img src="'+data+'" alt=""><button class="btn btn-line btn-sm" type="button" id="dPx">사진 빼기</button>'; bindPx(); }); };
  async function commit(mutate,msg,done,extra){
    var err=$("#dErr"); err.textContent="GitHub에 저장하는 중…";
    try{ if(extra) await extra(); var cur=await ghGetList(c,"diary.json","posts"), list=mutate(cur.list.slice()); await ghPutFile(c,"diary.json",wrapList("posts",list),msg,cur.sha); diary=sortByDate(list); editingDiary=null; toast(done); renderDiaryAdmin(el); }
    catch(e){ err.textContent=ghErr(e); }
  }
  if(x){ $("#dNew").onclick=function(){ editingDiary=null; renderDiaryAdmin(el); };
    $("#dDel").onclick=function(){ var b=this; if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="정말 삭제할까요?"; return; }
      commit(function(l){ return l.filter(function(n){return n.id!==x.id;}); },"기록 삭제: "+x.title,"기록을 삭제했어요. 1~2분 뒤 사이트에 반영돼요.",x.photo?function(){ return ghDeleteFile(c,x.photo,"사진 삭제: "+x.title).catch(function(){}); }:null); }; }
  $("#df").onsubmit=function(e){
    e.preventDefault(); var t=$("#dT").value.trim(), b=$("#dB").value.trim(), dv=$("#dD").value;
    if(!t||!b){ $("#dErr").textContent="제목과 내용을 모두 적어 주세요."; return; }
    var id=x?x.id:uid(), when=dv?new Date(dv+"T12:00:00").getTime():Date.now();
    var data={id:id,title:t,body:b,mood:$("#dM").value,date:when,photo:x&&x.photo&&!dropPhoto?x.photo:"",edited:x?Date.now():null};
    var path="uploads/"+id+"-"+Date.now().toString(36)+".jpg";
    var up=photoData?function(){ return ghPutFile(c,path,photoData.split(",")[1],"사진 올리기: "+t).then(function(){ data.photo=path; }); }:null;
    commit(function(l){ var i=-1; l.forEach(function(n,k){ if(n.id===data.id) i=k; }); if(i>-1) l[i]=data; else l.push(data); return l; },(x?"기록 수정: ":"기록 추가: ")+t,(x?"기록을 고쳤어요":"기록을 올렸어요")+". 1~2분 뒤 사이트에 반영돼요.",up);
  };
}

function renderAskAdmin(el){
  var x=editingAsk?asks.filter(function(n){return n.id===editingAsk;})[0]:null, pre=askPrefill||{}, c=gh(), ready=ghReady();
  el.innerHTML='<form class="form" id="af" novalidate><h3 style="font-size:19px;font-weight:800">'+(x?'답변 고치기':'질문에 답하기')+'</h3>'+
    '<p class="note">질문은 설정한 이메일로 와요. 메일 속 링크를 누르면 질문이 여기에 자동으로 채워져요. 답변을 올리면 질문과 함께 ASK 페이지에 공개돼요.</p>'+
    '<div class="f"><label for="aQ">질문</label><textarea id="aQ" maxlength="500" style="min-height:90px">'+esc(x?x.q:(pre.q||""))+'</textarea></div>'+
    '<div class="f"><label for="aN">질문한 사람 닉네임 (선택)</label><input id="aN" maxlength="20" value="'+esc(x?(x.nick||""):(pre.nick||""))+'" placeholder="비우면 익명"></div>'+
    '<div class="f"><label for="aA">답변</label><textarea id="aA" maxlength="3000" style="min-height:170px">'+esc(x?x.a:"")+'</textarea></div>'+
    '<p class="err" id="aErr" role="alert"></p><div class="row"><button class="btn btn-main" type="submit"'+(ready?'':' disabled')+'>'+(x?'고친 답변 올리기':'답변 올리기')+'</button>'+(x||pre.q?'<button class="btn btn-line" type="button" id="aNew">비우기</button>':'')+(x?'<button class="btn btn-danger" type="button" id="aDel"'+(ready?'':' disabled')+'>삭제</button>':'')+'</div>'+adminSaveNote()+'</form>'+
    '<h3 style="font-size:17px;font-weight:800;margin:30px 0 10px">공개한 답변 '+asks.length+'개</h3><div class="list">'+(asks.length?asks.map(function(n){ return '<button class="item" type="button" data-edit-a="'+n.id+'" style="grid-template-columns:1fr"><span><span class="tag">Q&amp;A</span><h3>'+esc(n.q.length>70?n.q.slice(0,70)+"…":n.q)+'</h3><time>'+fmtDate(n.aDate)+'</time></span></button>'; }).join(""):'<div class="empty">아직 답변한 질문이 없어요.</div>')+'</div>';
  $$("[data-edit-a]").forEach(function(b){ b.onclick=function(){ editingAsk=b.dataset.editA; askPrefill=null; renderAskAdmin(el); window.scrollTo(0,0); }; });
  async function commit(mutate,msg,done){
    var err=$("#aErr"); err.textContent="GitHub에 저장하는 중…";
    try{ var cur=await ghGetList(c,"asks.json","asks"), list=mutate(cur.list.slice()); await ghPutFile(c,"asks.json",wrapList("asks",list),msg,cur.sha); asks=list.slice().sort(function(a,b){ return (b.aDate||0)-(a.aDate||0); }); editingAsk=null; askPrefill=null; toast(done); renderAskAdmin(el); }
    catch(e){ err.textContent=ghErr(e); }
  }
  var nb=$("#aNew"); if(nb) nb.onclick=function(){ editingAsk=null; askPrefill=null; renderAskAdmin(el); };
  if(x) $("#aDel").onclick=function(){ var b=this; if(!b.dataset.sure){ b.dataset.sure="1"; b.textContent="정말 삭제할까요?"; return; } commit(function(l){ return l.filter(function(n){return n.id!==x.id;}); },"답변 삭제","답변을 삭제했어요. 1~2분 뒤 사이트에 반영돼요."); };
  $("#af").onsubmit=function(e){
    e.preventDefault(); var q=$("#aQ").value.trim(), a=$("#aA").value.trim();
    if(!q||!a){ $("#aErr").textContent="질문과 답변을 모두 적어 주세요."; return; }
    var data={id:x?x.id:(pre.id||uid()),q:q,nick:$("#aN").value.trim(),a:a,qDate:x?x.qDate:(pre.date||Date.now()),aDate:x?x.aDate:Date.now(),edited:x?Date.now():null};
    commit(function(l){ var i=-1; l.forEach(function(n,k){ if(n.id===data.id) i=k; }); if(i>-1) l[i]=data; else l.push(data); return l; },(x?"답변 수정: ":"답변 추가: ")+q.slice(0,30),(x?"답변을 고쳤어요":"답변을 올렸어요")+". 1~2분 뒤 사이트에 반영돼요.");
  };
}

/* ================================================================
   복사
   ================================================================ */
function copy(txt){
  if(!txt) return;
  function fb(){ var ta=document.createElement("textarea"); ta.value=txt; ta.style.position="fixed"; ta.style.opacity="0"; document.body.appendChild(ta); ta.select(); try{ document.execCommand("copy"); toast("복사했어요"); }catch(e){ toast("복사하지 못했어요"); } document.body.removeChild(ta); }
  try{ navigator.clipboard.writeText(txt).then(function(){ toast("복사했어요"); },fb); }catch(e){ fb(); }
}
