<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f4f5f7">
<title>시험 스터디</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<style>
:root{
  --bg:#f4f5f7; --surface:#fff; --ink:#15171c; --on-ink:#fff; --sub:#6b7280; --faint:#9aa1ad; --line:#e6e8ec;
  --blue:#3355ff; --blue-soft:#eef1ff; --mark:#ffe14d; --mark-soft:#fff7c2; --mark-hl:#ffe14d; --dark-fixed:#15171c;
  --ok:#119a55; --ok-soft:#e8f7ef; --danger:#e5484d; --danger-soft:#fff1f1; --danger-line:#f3c9ca;
  --outer:#e9ebef; --glass:rgba(244,245,247,.88); --glass2:rgba(255,255,255,.94); --side:#15171c; --knob-off:#cfd3da; --body-text:#3b3f48;
  --hover-ink:#2b2f38; --field:#f4f5f7; --field-focus:#fff; --shadow:rgba(0,0,0,.2); color-scheme:light;
  --font:"Pretendard Variable","Pretendard","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1115; --surface:#1a1d23; --ink:#eef0f4; --on-ink:#121418; --sub:#a0a7b3; --faint:#6c7380; --line:#2a2e36;
  --blue:#6f8aff; --blue-soft:rgba(111,138,255,.16); --mark-soft:rgba(255,225,77,.14); --mark-hl:rgba(255,225,77,.38);
  --ok:#3fcf87; --ok-soft:rgba(63,207,135,.14); --danger:#ff6b6f; --danger-soft:rgba(255,107,111,.12); --danger-line:rgba(255,107,111,.35);
  --outer:#07080a; --glass:rgba(15,17,21,.85); --glass2:rgba(26,29,35,.92); --side:#0a0b0e; --knob-off:#3a3f49; --body-text:#c9ced6;
  --hover-ink:#ffffff; --field:#14171c; --field-focus:#1f232a; --shadow:rgba(0,0,0,.5); color-scheme:dark;}}
:root[data-theme="dark"]{--bg:#0f1115; --surface:#1a1d23; --ink:#eef0f4; --on-ink:#121418; --sub:#a0a7b3; --faint:#6c7380; --line:#2a2e36;
  --blue:#6f8aff; --blue-soft:rgba(111,138,255,.16); --mark-soft:rgba(255,225,77,.14); --mark-hl:rgba(255,225,77,.38);
  --ok:#3fcf87; --ok-soft:rgba(63,207,135,.14); --danger:#ff6b6f; --danger-soft:rgba(255,107,111,.12); --danger-line:rgba(255,107,111,.35);
  --outer:#07080a; --glass:rgba(15,17,21,.85); --glass2:rgba(26,29,35,.92); --side:#0a0b0e; --knob-off:#3a3f49; --body-text:#c9ced6;
  --hover-ink:#ffffff; --field:#14171c; --field-focus:#1f232a; --shadow:rgba(0,0,0,.5); color-scheme:dark;}
html,body,.box,.ncard,.mcard,.panel,.stat,.gate,.sheet,.tabbar,.topbar,.inp{transition:background-color .25s,border-color .25s,color .25s}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.55;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
button,input,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2.5px solid var(--blue);outline-offset:2px}
svg.i{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.warnbar{background:var(--danger-soft);color:var(--danger);font-size:13px;padding:10px 20px;text-align:center}

/* ===================== 회원 화면 (모바일 우선) ===================== */
body.mode-member{background:var(--outer)}
.app{max-width:480px;margin:0 auto;min-height:100vh;min-height:100dvh;background:var(--bg);padding-bottom:calc(84px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(12px + env(safe-area-inset-top)) 20px 12px;background:var(--glass);backdrop-filter:saturate(1.6) blur(14px);-webkit-backdrop-filter:saturate(1.6) blur(14px)}
.topbar .t{font-size:19px;font-weight:800;letter-spacing:-.03em;margin-right:auto}
.acct{display:flex;align-items:center;gap:8px;padding:5px 12px 5px 5px;border-radius:99px;background:var(--surface);border:1px solid var(--line);font-size:14px;font-weight:600}
.avatar{width:28px;height:28px;border-radius:50%;background:var(--ink);color:var(--on-ink);display:grid;place-items:center;font-size:13px;font-weight:700}
.avatar.guest{background:var(--line);color:var(--sub)}
.chip-admin{font-size:13px;font-weight:700;padding:6px 12px;border-radius:99px;background:var(--dark-fixed);color:var(--mark)}

.view{padding:4px 20px 24px;display:flex;flex-direction:column;gap:14px}
.date{font-size:14px;color:var(--sub);font-weight:500;margin-top:6px}
.h1{font-size:26px;font-weight:800;letter-spacing:-.035em;line-height:1.3;margin:2px 0 6px}
.h1 mark{background:linear-gradient(transparent 58%,var(--mark-hl) 58%,var(--mark-hl) 92%,transparent 92%);color:inherit;padding:0 2px}

.box{background:var(--surface);border-radius:22px;padding:20px}
.ringrow{display:flex;align-items:center;gap:20px}
.ring{position:relative;width:112px;height:112px;flex:none}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .bgc{stroke:var(--line)}
.ring .fg{stroke:var(--blue);transition:stroke-dashoffset .8s cubic-bezier(.2,.8,.2,1)}
.ring .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center;line-height:1.1}
.ring .num b{font-size:30px;font-weight:800;letter-spacing:-.04em}
.ring .num b small{font-size:15px;font-weight:700}
.ring .num span{display:block;font-size:12px;color:var(--sub);font-weight:500}
.kv{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--sub)}
.kv strong{color:var(--ink);font-weight:700}
.state{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;padding:4px 10px;border-radius:99px;width:max-content}
.state.on{background:var(--ok-soft);color:var(--ok)}
.state.off{background:var(--bg);color:var(--sub)}
.state i{width:7px;height:7px;border-radius:50%;background:currentColor}
.state.on i{animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}

.cta{width:100%;height:58px;border-radius:18px;background:var(--ink);color:var(--on-ink);font-size:17px;font-weight:700;display:flex;align-items:center;justify-content:center;gap:8px;margin-top:18px;transition:transform .1s}
.cta:active{transform:scale(.98)}
.cta:disabled{background:var(--line);color:var(--faint);cursor:default;transform:none}
.cta.done{background:var(--mark);color:var(--dark-fixed)}
.cta.done:disabled{background:var(--mark);color:var(--dark-fixed)}
.cta.pop{animation:pop .5s cubic-bezier(.3,1.6,.5,1)}
@keyframes pop{0%{transform:scale(.9)}100%{transform:scale(1)}}
.note{font-size:13px;color:var(--sub);text-align:center;margin-top:10px}

.sec-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.sec-t h3{margin:0;font-size:16px;font-weight:700}
.sec-t span{font-size:13px;color:var(--sub)}
.dots{display:grid;grid-template-columns:repeat(10,1fr);gap:6px}
.dots i{aspect-ratio:1;border-radius:6px;background:var(--bg)}
.dots i.on{background:var(--blue)}
.dots i.today{background:var(--mark);box-shadow:inset 0 0 0 2px var(--dark-fixed)}

.next{display:flex;gap:12px;align-items:center;font-size:14px}
.next .ic{width:40px;height:40px;border-radius:12px;background:var(--mark-soft);color:var(--ink);display:grid;place-items:center;flex:none}
.bar{height:6px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}

.linkcard{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.linkcard .x{flex:1;min-width:0}
.linkcard .x b{display:block;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.linkcard .x span{font-size:13px;color:var(--sub)}
.chev{color:var(--faint)}

.guest .h1{font-size:28px}
.btn-row{display:flex;flex-direction:column;gap:10px;margin-top:6px}
.btn-sec{width:100%;height:54px;border-radius:16px;background:var(--surface);border:1px solid var(--line);font-size:16px;font-weight:700}

.ncard{background:var(--surface);border-radius:20px;overflow:hidden}
.ncard summary{list-style:none;padding:18px 20px;cursor:pointer;display:block}
.ncard summary::-webkit-details-marker{display:none}
.ncard .nt{font-size:16px;font-weight:700;line-height:1.4}
.ncard .nd{font-size:13px;color:var(--faint);margin-top:4px}
.ncard .pin{display:inline-block;font-size:11px;font-weight:800;background:var(--mark);padding:1px 7px;border-radius:5px;margin-right:6px;vertical-align:2px}
.ncard .nb{padding:0 20px 20px;white-space:pre-wrap;color:var(--body-text);font-size:15px;line-height:1.7}
.ncard[open] summary{padding-bottom:12px}

.mcard{background:var(--surface);border-radius:20px;padding:16px;display:flex;gap:14px;align-items:center}
.mcard .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue)}
.mcard.locked .ic{background:var(--bg);color:var(--faint)}
.mcard .x{flex:1;min-width:0}
.mcard .x b{display:block;font-weight:700;line-height:1.35}
.mcard.locked .x b{color:var(--sub)}
.mcard .x p{margin:2px 0 0;font-size:13px;color:var(--sub)}
.mcard .req{font-size:12px;color:var(--faint);margin-top:4px}
.open-btn{flex:none;height:36px;padding:0 16px;border-radius:99px;background:var(--ink);color:var(--on-ink);font-size:14px;font-weight:700;display:inline-flex;align-items:center}
.need{flex:none;font-size:12px;font-weight:700;color:var(--sub);text-align:right;line-height:1.3}
.need b{display:block;font-size:15px;color:var(--ink)}
.empty{background:var(--surface);border-radius:20px;padding:32px 20px;text-align:center;color:var(--sub);font-size:14px}

.tabbar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;z-index:6;display:grid;grid-template-columns:repeat(3,1fr);background:var(--glass2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom))}
.tabbar button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:12px;font-weight:600;color:var(--faint);border-radius:12px}
.tabbar button.on{color:var(--ink)}
.tabbar button.on svg{stroke-width:2.4}

/* 시트/모달 */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(15,17,22,.45);display:none;align-items:flex-end;justify-content:center}
.overlay.show{display:flex}
.sheet{width:100%;max-width:480px;background:var(--surface);border-radius:26px 26px 0 0;padding:10px 22px calc(22px + env(safe-area-inset-bottom));animation:up .28s cubic-bezier(.2,.8,.2,1)}
.sheet::before{content:"";display:block;width:40px;height:5px;border-radius:99px;background:var(--line);margin:0 auto 16px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (min-width:640px){.overlay{align-items:center}.sheet{max-width:400px;border-radius:24px;padding:26px}.sheet::before{display:none}}
.sheet h2{margin:0 0 4px;font-size:22px;font-weight:800;letter-spacing:-.03em}
.sheet .desc{margin:0 0 8px;color:var(--sub);font-size:14px}
.field{margin-top:14px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--sub);margin-bottom:6px}
.inp{width:100%;height:52px;padding:0 16px;border-radius:14px;border:1.5px solid var(--line);background:var(--field);font-size:16px;transition:border-color .15s,background .15s}
.inp:focus{outline:none;border-color:var(--ink);background:var(--field-focus)}
textarea.inp{height:auto;min-height:160px;padding:14px 16px;resize:vertical;line-height:1.6}
.err{color:var(--danger);font-size:13px;font-weight:600;min-height:20px;margin-top:10px}
.sheet .actions{display:flex;gap:8px;margin-top:6px}
.sheet .actions .cta{margin-top:0;flex:2}
.sheet .actions .btn-sec{flex:1;height:58px;border-radius:18px}
.menu{display:flex;flex-direction:column;margin-top:4px}
.menu button{display:flex;align-items:center;gap:14px;padding:16px 4px;font-size:16px;font-weight:600;text-align:left;border-bottom:1px solid var(--line)}
.menu button:last-child{border-bottom:0}
.menu button.danger{color:var(--danger)}
.menu .mi{width:40px;height:40px;border-radius:12px;background:var(--bg);display:grid;place-items:center}

.iconbtn{width:38px;height:38px;border-radius:50%;background:var(--surface);border:1px solid var(--line);display:grid;place-items:center;color:var(--ink)}
.iconbtn svg.i{width:19px;height:19px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.seg button{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 8px;border-radius:16px;border:1.5px solid var(--line);background:var(--field);font-size:14px;font-weight:600;color:var(--sub)}
.seg button.on{border-color:var(--ink);color:var(--ink);background:var(--surface)}
.seg .sw{width:44px;height:30px;border-radius:8px;border:1px solid var(--line);overflow:hidden;display:flex}
.seg .sw i{flex:1}
.toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translate(-50%,10px);background:var(--ink);color:var(--on-ink);padding:12px 18px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.25s;z-index:30;white-space:nowrap}
.toast.show{opacity:1;transform:translate(-50%,0)}
body.mode-admin .toast{bottom:32px}

/* ===================== 관리자 화면 (PC) ===================== */
.admin{display:grid;grid-template-columns:248px 1fr;min-height:100vh}
.side{background:var(--side);color:#c9ccd3;padding:28px 16px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.side .brand{color:#fff;font-size:18px;font-weight:800;padding:0 12px 4px;letter-spacing:-.03em}
.side .brand-sub{font-size:12px;padding:0 12px 24px;color:var(--mark);font-weight:700}
.side nav{display:flex;flex-direction:column;gap:2px}
.side nav button,.side .foot button{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:10px;font-size:15px;font-weight:600;color:inherit;text-align:left;width:100%}
.side nav button:hover,.side .foot button:hover{background:rgba(255,255,255,.06);color:#fff}
.side nav button.on{background:rgba(255,255,255,.1);color:#fff}
.side nav button.on svg{color:var(--mark)}
.side svg.i{width:20px;height:20px}
.side .foot{margin-top:auto;border-top:1px solid rgba(255,255,255,.1);padding-top:12px;display:flex;flex-direction:column;gap:2px}
.side .count{margin-left:auto;font-size:12px;background:rgba(255,255,255,.12);padding:1px 8px;border-radius:99px}

.amain{padding:36px 44px 60px;min-width:0}
.ahead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px;flex-wrap:wrap}
.ahead h1{margin:0;font-size:28px;font-weight:800;letter-spacing:-.035em}
.ahead p{margin:4px 0 0;color:var(--sub);font-size:14px}
.inner{max-width:1100px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:24px}
.panel h2{margin:0 0 4px;font-size:17px;font-weight:700}
.panel .pd{margin:0 0 16px;font-size:13px;color:var(--sub)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:14px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px}
.stat span{font-size:13px;color:var(--sub);font-weight:600}
.stat b{display:block;font-size:30px;font-weight:800;letter-spacing:-.04em;margin-top:6px;line-height:1.1}
.stat b small{font-size:15px;color:var(--sub);font-weight:600}

.gate{display:flex;align-items:center;gap:24px;padding:28px;border-radius:16px;margin-bottom:14px;border:1px solid var(--line);background:var(--surface)}
.gate.on{background:var(--mark);border-color:var(--mark)}
.gate.on .switch input:checked + .tr{background:var(--dark-fixed)}
.gate.on .switch input:checked + .tr::after{background:#fff}
.gate .x{flex:1}
.gate h2{margin:0;font-size:22px;font-weight:800;letter-spacing:-.03em}
.gate p{margin:4px 0 0;font-size:14px;color:var(--sub)}
.gate.on h2{color:var(--dark-fixed)}
.gate.on p{color:#4a4418}
.switch{position:relative;display:inline-block;width:64px;height:36px;flex:none;cursor:pointer}
.switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.switch .tr{position:absolute;inset:0;border-radius:99px;background:var(--knob-off);transition:.2s;pointer-events:none}
.switch .tr::after{content:"";position:absolute;top:4px;left:4px;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 1px 3px var(--shadow);transition:.2s}
.switch input:checked + .tr{background:var(--ink)}
.switch input:checked + .tr::after{background:var(--on-ink)}
.switch input:checked + .tr::after{left:32px}
.switch input:focus-visible + .tr{outline:2.5px solid var(--blue);outline-offset:3px}

.cols{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.cols.form{grid-template-columns:400px 1fr;align-items:start}
.plist{display:flex;flex-direction:column}
.prow{display:flex;align-items:center;gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.prow:first-child{border-top:0}
.prow .x{flex:1;min-width:0}
.prow .x b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .x span{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.tag{font-size:12px;font-weight:700;padding:3px 9px;border-radius:6px;background:var(--bg);color:var(--sub);white-space:nowrap}
.tag.y{background:var(--mark);color:var(--dark-fixed)}
.tag.g{background:var(--ok-soft);color:var(--ok)}
.btn{height:40px;padding:0 16px;border-radius:10px;background:var(--ink);color:var(--on-ink);font-size:14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;white-space:nowrap}
.btn:hover{background:var(--hover-ink)}
.btn.lg{height:48px;width:100%;font-size:15px;margin-top:18px}
.btn.line{background:var(--surface);color:var(--ink);border:1px solid var(--line)}
.btn.line:hover{background:var(--bg)}
.btn.sm{height:32px;padding:0 12px;font-size:13px;border-radius:8px}
.btn.del{background:var(--surface);color:var(--danger);border:1px solid var(--danger-line)}
.btn.del:hover{background:var(--danger-soft)}
.amain .inp{height:46px;font-size:15px;border-radius:10px}
.amain textarea.inp{min-height:180px}
.amain .field{margin-top:14px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.check{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600;margin-top:14px;cursor:pointer}
.check input{width:18px;height:18px;accent-color:var(--ink)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{text-align:left;font-size:12px;font-weight:700;color:var(--sub);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:14px 12px;border-bottom:1px solid var(--line);white-space:nowrap;vertical-align:middle}
tr:last-child td{border-bottom:0}
.minibar{display:flex;align-items:center;gap:10px}
.minibar .bar{width:110px;margin:0}
.who2{display:flex;align-items:center;gap:10px}
.who2 .avatar{width:32px;height:32px}
.who2 small{display:block;color:var(--sub);font-size:12px}
.pill-list{display:flex;flex-wrap:wrap;gap:8px}
.pill-list span{font-size:14px;font-weight:600;padding:6px 12px;border-radius:99px;background:var(--bg)}
.pill-list.done span{background:var(--blue-soft);color:var(--blue)}
.aempty{color:var(--sub);font-size:14px;padding:12px 0}

@media (max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.cols.form{grid-template-columns:1fr}}
@media (max-width:860px){
  .admin{grid-template-columns:1fr}
  .side{position:static;height:auto;flex-direction:row;flex-wrap:wrap;align-items:center;padding:14px 16px;gap:8px}
  .side .brand-sub{display:none}.side .brand{padding:0 8px 0 4px}
  .side nav{flex-direction:row;overflow-x:auto;width:100%;order:3}
  .side nav button{white-space:nowrap;width:auto}
  .side .foot{margin:0 0 0 auto;border:0;padding:0;flex-direction:row}
  .side .foot button{width:auto;font-size:13px}
  .amain{padding:24px 16px 60px}
  .cols{grid-template-columns:1fr}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="sheet" id="modal"></div></div>
<div class="toast" id="toast" role="status"></div>

<script type="module">
/* ========== Firebase ========== */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, updatePassword, reauthenticateWithCredential, EmailAuthProvider } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";
import { getFirestore, doc, collection, onSnapshot, getDoc, setDoc, updateDoc, deleteDoc, writeBatch } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDnor1tHuwttfCW_Skt21Iwwd5gqom-eyI",
  authDomain: "study-e0d2b.firebaseapp.com",
  projectId: "study-e0d2b",
  storageBucket: "study-e0d2b.firebasestorage.app",
  messagingSenderId: "206543223080",
  appId: "1:206543223080:web:c1278afdb1c0c37bce381d"
};
const fbApp=initializeApp(firebaseConfig);
const auth=getAuth(fbApp);
const fs=getFirestore(fbApp);

/* ========== 유틸 ========== */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function prettyDate(){const d=new Date();return `${d.getMonth()+1}월 ${d.getDate()}일 ${'일월화수목금토'[d.getDay()]}요일`;}
function shortDate(s){const p=String(s).split('-');return p.length===3?`${+p[1]}월 ${+p[2]}일`:s;}
function safeUrl(u){try{const x=new URL(u);return(x.protocol==='http:'||x.protocol==='https:')?x.href:null;}catch(e){return null;}}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200);}
const I={
  check:'<path d="M5 12.5l4.5 4.5L19 7.5"/>',
  notice:'<path d="M4 10v4h3l6 4V6L7 10H4z"/><path d="M17 9a4 4 0 010 6"/>',
  book:'<path d="M5 4h10a3 3 0 013 3v13H8a3 3 0 01-3-3V4z"/><path d="M5 17a3 3 0 013-3h10"/>',
  lock:'<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/>',
  user:'<circle cx="12" cy="8" r="4"/><path d="M4 20c1.5-4 4.5-6 8-6s6.5 2 8 6"/>',
  users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 19c1-3.5 3.5-5 6.5-5s5.5 1.5 6.5 5"/><path d="M16 4.5a3.5 3.5 0 010 7"/><path d="M18 14c2 .6 3.2 2.3 3.5 5"/>',
  grid:'<rect x="4" y="4" width="7" height="7" rx="1.5"/><rect x="13" y="4" width="7" height="7" rx="1.5"/><rect x="4" y="13" width="7" height="7" rx="1.5"/><rect x="13" y="13" width="7" height="7" rx="1.5"/>',
  gear:'<circle cx="12" cy="12" r="3"/><path d="M12 3v2.5M12 18.5V21M3 12h2.5M18.5 12H21M5.6 5.6l1.8 1.8M16.6 16.6l1.8 1.8M5.6 18.4l1.8-1.8M16.6 7.4l1.8-1.8"/>',
  key:'<circle cx="8" cy="15" r="4"/><path d="M11 12l8-8M16 7l2 2M14 9l2 2"/>',
  out:'<path d="M15 4h3a2 2 0 012 2v12a2 2 0 01-2 2h-3"/><path d="M10 16l-4-4 4-4M6 12h10"/>',
  phone:'<rect x="7" y="3" width="10" height="18" rx="2.5"/><path d="M11 18h2"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',
  plus:'<path d="M12 5v14M5 12h14"/>',
  moon:'<path d="M20 14.5A8 8 0 019.5 4a8 8 0 1010.5 10.5z"/>',
  sun:'<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>'
};
const ic=(n,cls='i')=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${I[n]}</svg>`;

/* ========== 저장소 ========== */
/* ========== 테마 ========== */
const mq=window.matchMedia?matchMedia('(prefers-color-scheme: dark)'):null;
let themePref='system';try{themePref=localStorage.getItem('studyGroup.theme')||'system';}catch(e){}
const isDark=()=>themePref==='dark'||(themePref==='system'&&!!(mq&&mq.matches));
function applyTheme(){
  const r=document.documentElement;
  if(themePref==='system')r.removeAttribute('data-theme');else r.setAttribute('data-theme',themePref);
  const m=document.querySelector('meta[name=theme-color]');if(m)m.content=isDark()?'#0f1115':'#f4f5f7';
}
function setTheme(t){themePref=t;try{localStorage.setItem('studyGroup.theme',t);}catch(e){}applyTheme();render();}
if(mq){const f=()=>{if(themePref==='system'){applyTheme();render();}};mq.addEventListener?mq.addEventListener('change',f):mq.addListener&&mq.addListener(f);}
applyTheme();

/* ========== 데이터 (Firebase) ========== */
// 아이디는 "아이디@DOMAIN" 형태의 로그인 계정으로 저장됩니다. 실제로 메일이 가지는 않아요.
const DOMAIN='study-e0d2b.firebaseapp.com';
const ADMIN_ID='admin';
const emailOf=id=>id+'@'+DOMAIN;
const DEFAULT_SETTINGS={checkinOpen:false,totalDays:30};
const WELCOME={title:'시험 대비 도서관 스터디 팀원 모집',
  body:'시험을 함께 준비할 스터디 팀원을 모집합니다.\n\n• 장소: 도서관 스터디룸\n• 진행: 매일 정해진 시간에 모여 각자 공부하고, 주기적으로 학습 지도를 진행합니다.\n• 자료 배포: 학습 자료는 자료실 탭에서 열람할 수 있습니다. 자료는 출석률에 따라 차등 공개되니 꾸준히 출석해 주세요.\n• 출석체크: 스터디 시간에 관리자가 출석체크를 열면, 출석 탭에서 "오늘 출석하기"를 눌러 주세요.\n\n참여를 원하시면 오른쪽 위 버튼을 눌러 회원가입해 주세요.'};

let db={users:[],notices:[],materials:[],attendance:{},settings:{...DEFAULT_SETTINGS}};
let authUser;             // undefined: 확인 중 / null: 로그아웃 상태
let myProfile=null;       // 로그인한 회원 본인 정보
let profileState='none';  // none | loading | ok
let linkCache={};         // 자료 id → 링크 (열 수 있는 자료만)
let linkTried={};         // 자료 id → 링크를 요청했을 때의 출석률
let storageOK=true;       // 서버 연결 상태
let pendingSignup=false;
let roleUnsubs=[];

const sess={
  get(k){try{return sessionStorage.getItem(k);}catch(e){return sess['_'+k]||null;}},
  set(k,v){try{v==null?sessionStorage.removeItem(k):sessionStorage.setItem(k,v);}catch(e){sess['_'+k]=v;}}
};
let isAdmin=false;
let tab=sess.get('sg_tab')||'home';
let apage=sess.get('sg_apage')||'dash';

const isAdminUser=()=>!!authUser&&authUser.email===emailOf(ADMIN_ID);
const myId=()=>authUser&&!isAdminUser()?String(authUser.email).split('@')[0]:null;
const daysOf=d=>Object.keys((d&&d.days)||{}).filter(k=>d.days[k]).sort();
const rows=s=>s.docs.map(d=>({id:d.id,...d.data()}));
const lerr=e=>{console.error(e);storageOK=false;render();};
function fail(e){
  console.error(e);
  toast(e&&e.code==='permission-denied'?'권한이 없어 처리하지 못했어요':'서버에 저장하지 못했어요. 인터넷 연결을 확인해 주세요');
}

// 누구나 보는 데이터
onSnapshot(doc(fs,'settings','main'),s=>{db.settings={...DEFAULT_SETTINGS,...(s.data()||{})};storageOK=true;render();},lerr);
onSnapshot(collection(fs,'notices'),s=>{db.notices=rows(s);render();},lerr);
onSnapshot(collection(fs,'materials'),s=>{db.materials=rows(s).map(m=>({...m,minRate:+m.minRate||0}));render();},lerr);

function clearRole(){
  roleUnsubs.forEach(f=>f());roleUnsubs=[];
  db.users=[];db.attendance={};myProfile=null;profileState='none';linkCache={};linkTried={};
}
async function logout(){clearRole();try{await signOut(auth);}catch(e){}}

onAuthStateChanged(auth,u=>{
  clearRole();authUser=u;
  if(u&&isAdminUser()){
    roleUnsubs.push(onSnapshot(collection(fs,'users'),s=>{db.users=rows(s);render();},lerr));
    roleUnsubs.push(onSnapshot(collection(fs,'attendance'),s=>{const a={};s.docs.forEach(d=>a[d.id]=daysOf(d.data()));db.attendance=a;render();},lerr));
    roleUnsubs.push(onSnapshot(collection(fs,'materialLinks'),s=>{const c={};s.docs.forEach(d=>c[d.id]=d.data().url);linkCache=c;render();},lerr));
    ensureSetup();
  }else if(u){
    const id=myId();profileState='loading';
    roleUnsubs.push(onSnapshot(doc(fs,'users',id),s=>{
      if(s.exists()){myProfile={id,...s.data()};profileState='ok';render();}
      else if(!pendingSignup){toast('회원 정보가 없어요. 관리자에게 문의해 주세요');logout();}
    },lerr));
    roleUnsubs.push(onSnapshot(doc(fs,'attendance',id),s=>{db.attendance={[id]:daysOf(s.data())};render();},lerr));
  }
  render();
});

// 관리자가 처음 로그인하면 기본 설정과 모집 공지를 만듭니다.
async function ensureSetup(){
  try{
    const s=await getDoc(doc(fs,'settings','main'));
    if(s.exists())return;
    const b=writeBatch(fs);
    b.set(doc(fs,'settings','main'),{...DEFAULT_SETTINGS});
    b.set(doc(collection(fs,'notices')),{...WELCOME,pinned:true,date:today()});
    await b.commit();
  }catch(e){console.error(e);}
}

// 출석률이 닿는 자료의 링크만 서버에서 받아 옵니다. (서버 규칙이 최종 판단)
function loadLinks(){
  const u=me();if(!u)return;const rate=stats(u.id).rate;
  db.materials.forEach(m=>{
    if(m.minRate>rate||linkCache[m.id]||linkTried[m.id]===rate)return;
    linkTried[m.id]=rate;
    getDoc(doc(fs,'materialLinks',m.id))
      .then(s=>{if(s.exists()&&me()){linkCache[m.id]=s.data().url;render();}})
      .catch(e=>console.warn('자료 링크를 열 수 없음',m.id,e.code));
  });
}

function authMsg(e){
  const c=(e&&e.code)||'';
  return({
    'auth/invalid-credential':'아이디 또는 비밀번호가 맞지 않습니다.',
    'auth/wrong-password':'아이디 또는 비밀번호가 맞지 않습니다.',
    'auth/user-not-found':'아이디 또는 비밀번호가 맞지 않습니다.',
    'auth/invalid-email':'아이디 형식이 올바르지 않습니다.',
    'auth/email-already-in-use':'이미 사용 중인 아이디입니다.',
    'auth/weak-password':'비밀번호는 6자 이상이어야 합니다.',
    'auth/too-many-requests':'시도가 너무 많아요. 잠시 후 다시 해 주세요.',
    'auth/network-request-failed':'인터넷 연결을 확인해 주세요.',
    'auth/operation-not-allowed':'Firebase에서 이메일/비밀번호 로그인이 꺼져 있어요.'
  })[c]||('문제가 생겼어요. 다시 시도해 주세요. ('+(c||'unknown')+')');
}

function stats(id){
  const list=(db.attendance[id]||[]).slice().sort();
  const total=Math.max(0,parseInt(db.settings.totalDays)||0);
  const rate=total>0?Math.min(100,Math.round(list.length/total*100)):0;
  return{list,count:list.length,total,rate,todayDone:list.includes(today())};
}
const me=()=>profileState==='ok'?myProfile:null;
const initial=n=>esc(String(n||'?').trim().charAt(0));

/* ========== 회원 화면 ========== */
function homeTab(){
  const u=me(),open=db.settings.checkinOpen;
  const state=`<span class="state ${open?'on':'off'}"><i></i>출석체크 ${open?'진행 중':'닫힘'}</span>`;
  const latest=db.notices.slice().sort((a,b)=>(b.pinned-a.pinned)||b.date.localeCompare(a.date))[0];
  const latestCard=latest?`<button class="box linkcard" data-act="tab" data-tab="notice">
      <div class="next"><div class="ic">${ic('notice')}</div></div>
      <div class="x"><b>${esc(latest.title)}</b><span>공지 · ${shortDate(latest.date)}</span></div>${ic('chev','i chev')}</button>`:'';

  if(!u){
    return`<div class="guest"><div class="date">${prettyDate()}</div>
      <h1 class="h1">함께 공부할<br><mark>시험 스터디</mark>에<br>오신 걸 환영해요</h1></div>
      <div class="box">
        <p style="margin:0 0 4px;font-size:15px">가입하면 매일 출석을 체크하고, 출석률에 따라 학습 자료가 열립니다.</p>
        ${state}
        <div class="btn-row" style="margin-top:18px"><button class="cta" style="margin:0" data-act="openSignup">회원가입</button>
        <button class="btn-sec" data-act="openLogin">로그인</button></div>
      </div>${latestCard}`;
  }
  const s=stats(u.id);
  const C=2*Math.PI*48,off=C*(1-s.rate/100);
  let btn;
  if(s.todayDone)btn=`<button class="cta done${window._justStamped?' pop':''}" disabled>${ic('check')}오늘 출석 완료</button>`;
  else if(!open)btn=`<button class="cta" disabled>오늘 출석하기</button><div class="note">관리자가 출석체크를 열면 누를 수 있어요</div>`;
  else btn=`<button class="cta" data-act="checkin">${ic('check')}오늘 출석하기</button>`;
  window._justStamped=false;

  const n=Math.min(Math.max(s.total,s.count),200);
  let dots='';for(let i=0;i<n;i++){const d=s.list[i];dots+=`<i class="${d?(d===today()?'on today':'on'):''}"${d?` title="${d}"`:''}></i>`;}

  const next=db.materials.filter(m=>m.minRate>s.rate).sort((a,b)=>a.minRate-b.minRate)[0];
  const unlocked=db.materials.filter(m=>m.minRate<=s.rate).length;
  const nextCard=next?`<div class="box"><div class="next"><div class="ic">${ic('lock')}</div>
      <div style="flex:1;min-width:0"><b>${next.minRate-s.rate}%p</b> 더 출석하면<br><b>${esc(next.title)}</b> 자료가 열려요
      <div class="bar"><i style="width:${Math.round(s.rate/next.minRate*100)}%"></i></div></div></div></div>`
    :db.materials.length?`<div class="box"><div class="next"><div class="ic">${ic('book')}</div><div>자료 ${unlocked}개가 모두 열려 있어요</div></div></div>`:'';

  return`<div><div class="date">${prettyDate()}</div>
    <h1 class="h1">${esc(u.name)}님,<br>${s.todayDone?'오늘 출석 <mark>완료</mark>했어요':'오늘도 <mark>한 칸</mark> 채워요'}</h1></div>
    <div class="box">
      <div class="ringrow">
        <div class="ring"><svg viewBox="0 0 112 112"><circle class="bgc" cx="56" cy="56" r="48" fill="none" stroke-width="12"/>
          <circle class="fg" cx="56" cy="56" r="48" fill="none" stroke-width="12" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${s.rate>0?off:C}"/></svg>
          <div class="num"><div><b>${s.rate}<small>%</small></b><span>출석률</span></div></div></div>
        <div class="kv"><div>출석 <strong>${s.count}일</strong></div><div>전체 <strong>${s.total}일</strong></div>${state}</div>
      </div>
      ${btn}
    </div>
    <div class="box"><div class="sec-t"><h3>출석 기록</h3><span>${s.count} / ${s.total}칸</span></div><div class="dots">${dots}</div></div>
    ${nextCard}${latestCard}`;
}

function noticeTab(){
  const list=db.notices.slice().sort((a,b)=>(b.pinned-a.pinned)||b.date.localeCompare(a.date));
  const items=list.length?list.map((n,i)=>`<details class="ncard"${i===0?' open':''}><summary>
      <div class="nt">${n.pinned?'<span class="pin">고정</span>':''}${esc(n.title)}</div><div class="nd">${shortDate(n.date)}</div></summary>
      <div class="nb">${esc(n.body)}</div></details>`).join('')
    :'<div class="empty">아직 올라온 공지가 없어요</div>';
  return`<h1 class="h1" style="margin-top:8px">공지사항</h1>${items}`;
}

function materialsTab(){
  const u=me(),rate=u?stats(u.id).rate:0;
  const list=db.materials.slice().sort((a,b)=>a.minRate-b.minRate);
  const head=`<h1 class="h1" style="margin-top:8px">자료실</h1>
    <p style="margin:-6px 0 4px;color:var(--sub);font-size:14px">${u?`내 출석률 <b style="color:var(--ink)">${rate}%</b> · 출석할수록 더 많은 자료가 열려요`:'로그인하면 출석률에 맞는 자료를 볼 수 있어요'}</p>`;
  if(!list.length)return head+'<div class="empty">아직 등록된 자료가 없어요</div>';
  return head+list.map(m=>{
    const ok=u&&rate>=m.minRate,url=safeUrl(linkCache[m.id]||'');
    const right=ok&&url?`<a class="open-btn" href="${esc(url)}" target="_blank" rel="noopener noreferrer">열기</a>`
      :ok?`<div class="need">불러오는 중</div>`
      :!u?`<button class="open-btn" style="background:var(--bg);color:var(--ink)" data-act="openLogin">로그인</button>`
      :`<div class="need"><b>${m.minRate-rate}%p</b>더 필요</div>`;
    return`<div class="mcard ${ok?'':'locked'}"><div class="ic">${ic(ok?'book':'lock')}</div>
      <div class="x"><b>${esc(m.title)}</b>${m.desc?`<p>${esc(m.desc)}</p>`:''}<div class="req">출석률 ${m.minRate}% 이상</div></div>${right}</div>`;
  }).join('');
}

function memberLayout(){
  const u=me();
  const acct=u?`<button class="acct" data-act="acct"><span class="avatar">${initial(u.name)}</span>${esc(u.name)}</button>`
    :`<button class="acct" data-act="acct"><span class="avatar guest">${ic('user','i')}</span>로그인</button>`;
  const back=sess.get('sg_admin_prev')==='1'?`<button class="chip-admin" data-act="backAdmin">관리자로</button>`:'';
  const body={home:homeTab,notice:noticeTab,materials:materialsTab}[tab]||homeTab;
  const tb=(k,label,icon)=>`<button class="${tab===k?'on':''}" data-act="tab" data-tab="${k}">${ic(icon)}${label}</button>`;
  return`<div class="app">
    <header class="topbar"><div class="t">시험 스터디</div>${back}<button class="iconbtn" data-act="theme" aria-label="화면 모드">${ic(isDark()?'sun':'moon')}</button>${acct}</header>
    ${storageOK?'':warnbar()}
    <main class="view">${body()}</main>
    <nav class="tabbar">${tb('home','출석','check')}${tb('notice','공지','notice')}${tb('materials','자료실','book')}</nav>
  </div>`;
}
const warnbar=()=>`<div class="warnbar">서버에 연결하지 못했어요. 인터넷 연결을 확인하고 새로고침해 주세요.</div>`;

/* ========== 관리자 화면 ========== */
function aDash(){
  const st=db.settings,us=db.users.map(u=>({u,s:stats(u.id)}));
  const done=us.filter(x=>x.s.todayDone),notyet=us.filter(x=>!x.s.todayDone);
  const avg=us.length?Math.round(us.reduce((a,x)=>a+x.s.rate,0)/us.length):0;
  return`
  <div class="gate ${st.checkinOpen?'on':''}">
    <div class="x"><h2>출석체크 ${st.checkinOpen?'진행 중':'닫힘'}</h2>

function render(){
  isAdmin=isAdminUser()&&sess.get('sg_admin_prev')!=='1';
  document.body.className=isAdmin?'mode-admin':'mode-member';
  const root=document.getElementById('root');
  if(authUser===undefined||profileState==='loading'){
    root.innerHTML='<div class="empty" style="padding-top:38vh">불러오는 중…</div>';return;
  }
  // 다른 사람이 데이터를 바꿔 화면이 새로 그려져도, 입력 중인 내용은 지켜 줍니다.
  const saved={},a=document.activeElement;
  root.querySelectorAll('.fbox').forEach(b=>{saved[b.id]={};b.querySelectorAll('input[name],textarea[name]').forEach(i=>saved[b.id][i.name]=i.type==='checkbox'?i.checked:i.value);});
  const focus=a&&root.contains(a)&&a.name&&a.closest('.fbox')?{f:a.closest('.fbox').id,n:a.name,s:a.selectionStart,e:a.selectionEnd}:null;
  root.innerHTML=isAdmin?adminLayout():memberLayout();
  Object.entries(saved).forEach(([fid,v])=>{const b=document.getElementById(fid);if(!b)return;
    Object.entries(v).forEach(([n,val])=>{const i=b.querySelector(`[name="${n}"]`);if(!i)return;if(i.type==='checkbox')i.checked=val;else i.value=val;});});
  if(focus){const i=document.querySelector(`#${focus.f} [name="${focus.n}"]`);if(i){i.focus();try{i.setSelectionRange(focus.s,focus.e);}catch(e){}}}
  if(!isAdmin)loadLinks();
}

/* ========== 시트(모달) ========== */
const overlay=document.getElementById('overlay'),modal=document.getElementById('modal');
let modalCb=null;
function openModal(kind,opt={}){
  modal.dataset.kind=kind;modalCb=opt.cb||null;
  const F=(label,name,type='text',extra='')=>`<div class="field"><label>${label}</label><input class="inp" type="${type}" name="${name}" ${extra}></div>`;
  const forms={
    login:`<h2>로그인</h2><p class="desc">내 출석 기록을 확인하려면 로그인하세요.</p>
      ${F('아이디','id','text','autocomplete="username" autocapitalize="off"')}${F('비밀번호','pw','password','autocomplete="current-password"')}`,
    signup:`<h2>회원가입</h2><p class="desc">출석은 계정별로 기록됩니다.</p>
      ${F('아이디 (영문 소문자·숫자 4~20자)','id','text','autocomplete="off" autocapitalize="off"')}${F('이름','name','text','maxlength="20"')}
      ${F('비밀번호 (6자 이상)','pw','password','autocomplete="new-password"')}${F('비밀번호 확인','pw2','password','autocomplete="new-password"')}`,
    admin:`<h2>관리자 로그인</h2><p class="desc">관리자 비밀번호를 입력하세요.</p>${F('비밀번호','pw','password','autocomplete="off"')}`,
    confirm:`<h2>${esc(opt.title||'확인')}</h2><p class="desc">${esc(opt.msg)}</p>`,
    prompt:`<h2>${esc(opt.title||'입력')}</h2>${F(esc(opt.msg),'val','text','autocomplete="off"')}`
  };
  if(kind==='theme'){
    const o=(k,label,a,b)=>`<button class="${themePref===k?'on':''}" data-act="setTheme" data-theme="${k}"><span class="sw"><i style="background:${a}"></i><i style="background:${b}"></i></span>${label}</button>`;
    modal.innerHTML=`<h2>화면 모드</h2><p class="desc">시스템 설정을 고르면 기기의 라이트·다크 설정을 따라갑니다.</p>
      <div class="seg">${o('system','시스템','#f4f5f7','#0f1115')}${o('light','라이트','#f4f5f7','#ffffff')}${o('dark','다크','#0f1115','#1a1d23')}</div>
      <div class="actions" style="margin-top:18px"><button type="button" class="cta" data-act="closeModal">닫기</button></div>`;
    overlay.classList.add('show');return;
  }
  if(kind==='menu'){
    const u=me();
    modal.innerHTML=(u?`<h2>${esc(u.name)}님</h2><p class="desc">${esc(u.id)}</p>`:`<h2>계정</h2>`)+`<div class="menu">`+
      (u?`<button data-act="logout"><span class="mi">${ic('out')}</span>로그아웃</button>`
        :`<button data-act="openLogin"><span class="mi">${ic('user')}</span>로그인</button><button data-act="openSignup"><span class="mi">${ic('plus')}</span>회원가입</button>`)+
      `<button data-act="openAdmin"><span class="mi">${ic('key')}</span>관리자 로그인</button><button data-act="theme"><span class="mi">${ic(isDark()?'sun':'moon')}</span>화면 모드</button></div>`;
  }else{
    const label={login:'로그인',signup:'가입하기',admin:'로그인',confirm:opt.ok||'확인',prompt:'저장'}[kind];
    modal.innerHTML=forms[kind]+`<div class="err" id="err"></div>
      <div class="actions"><button type="button" class="btn-sec" data-act="closeModal">취소</button><button type="button" class="cta" data-act="submitModal">${esc(label)}</button></div>`;
  }
  overlay.classList.add('show');
  setTimeout(()=>{const t=modal.querySelector('input')||modal.querySelector('[data-act=submitModal]');t&&t.focus();},60);
}
function closeModal(){overlay.classList.remove('show');modal.innerHTML='';modalCb=null;}
function askConfirm(msg,cb,ok,title){openModal('confirm',{msg,cb,ok,title});}
function askPrompt(msg,cb,title){openModal('prompt',{msg,cb,title});}
function collect(box){const d={};box.querySelectorAll('input[name],textarea[name]').forEach(i=>{d[i.name]=i.type==='checkbox'?i.checked:i.value;});return d;}
overlay.addEventListener('click',e=>{if(e.target===overlay)closeModal();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape'&&overlay.classList.contains('show'))return closeModal();
  if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!e.isComposing){
    if(modal.contains(e.target)){e.preventDefault();submitModal();}
    else{const box=e.target.closest('.fbox');if(box){e.preventDefault();handleForm(box.id);}}
  }
});

let busy=false;
async function submitModal(){
  const f=collect(modal);const err=m=>{const el=modal.querySelector('#err');if(el)el.textContent=m;};
  const kind=modal.dataset.kind;
  if(kind==='confirm'||kind==='prompt'){const cb=modalCb,v=f.val;closeModal();cb&&cb(v);return;}
  if(busy)return;
  const btn=modal.querySelector('[data-act=submitModal]');
  const lock=on=>{busy=on;if(btn)btn.disabled=on;};
  if(kind==='login'){
    const id=(f.id||'').trim().toLowerCase();
    if(!id||!f.pw)return err('아이디와 비밀번호를 입력하세요.');
    if(id===ADMIN_ID)return err('관리자는 메뉴의 "관리자 로그인"을 이용하세요.');
    lock(true);
    try{
      await signInWithEmailAndPassword(auth,emailOf(id),f.pw);
      sess.set('sg_admin_prev',null);tab='home';sess.set('sg_tab','home');closeModal();render();toast('로그인했어요');
    }catch(e){err(authMsg(e));}
    finally{lock(false);}
  }else if(kind==='signup'){
    const id=(f.id||'').trim().toLowerCase(),name=(f.name||'').trim();
    if(!/^[a-z0-9_]{4,20}$/.test(id))return err('아이디는 영문·숫자 4~20자로 입력하세요.');
    if(id===ADMIN_ID)return err('사용할 수 없는 아이디입니다.');
    if(!name)return err('이름을 입력하세요.');
    if((f.pw||'').length<6)return err('비밀번호는 6자 이상이어야 합니다.');
    if(f.pw!==f.pw2)return err('비밀번호 확인이 일치하지 않습니다.');
    lock(true);pendingSignup=true;
    try{
      await createUserWithEmailAndPassword(auth,emailOf(id),f.pw);
      try{
        const old=await getDoc(doc(fs,'users',id)); // 예전 기록이 있으면 가입일 유지
        await setDoc(doc(fs,'users',id),{name,joined:(old.exists()&&old.data().joined)||today()});
      }catch(e){pendingSignup=false;await logout();throw e;}
      sess.set('sg_admin_prev',null);tab='home';sess.set('sg_tab','home');closeModal();render();toast('가입 완료! 로그인되었어요');
    }catch(e){err(e&&e.code&&e.code.startsWith('auth/')?authMsg(e):'가입 정보를 저장하지 못했어요. 다시 시도해 주세요.');}
    finally{pendingSignup=false;lock(false);}
  }else if(kind==='admin'){
    if(!f.pw)return err('비밀번호를 입력하세요.');
    lock(true);
    try{
      await signInWithEmailAndPassword(auth,emailOf(ADMIN_ID),f.pw);
      sess.set('sg_admin_prev',null);closeModal();render();toast('관리자 모드로 전환했습니다');
    }catch(e){err(['auth/invalid-credential','auth/wrong-password','auth/user-not-found'].includes(e.code)?'관리자 비밀번호가 맞지 않습니다.':authMsg(e));}
    finally{lock(false);}
  }
}

/* ========== 동작 ========== */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const act=el.dataset.act,id=el.dataset.id;
  switch(act){
    case'acct':openModal('menu');break;
    case'theme':openModal('theme');break;
    case'setTheme':setTheme(el.dataset.theme);openModal('theme');break;
    case'openLogin':openModal('login');break;
    case'openSignup':openModal('signup');break;
    case'openAdmin':openModal('admin');break;
    case'closeModal':closeModal();break;
    case'submitModal':submitModal();break;
    case'submitForm':handleForm(el.dataset.form);break;
    case'tab':tab=el.dataset.tab;sess.set('sg_tab',tab);render();window.scrollTo(0,0);break;
    case'apage':apage=el.dataset.page;sess.set('sg_apage',apage);render();window.scrollTo(0,0);break;
    case'logout':closeModal();tab='home';sess.set('sg_tab','home');logout().then(()=>toast('로그아웃했어요'));break;
    case'adminLogout':sess.set('sg_admin_prev',null);logout().then(()=>toast('관리자 모드를 종료했습니다'));break;
    case'viewMember':sess.set('sg_admin_prev','1');render();window.scrollTo(0,0);break;
    case'backAdmin':sess.set('sg_admin_prev',null);render();break;
    case'checkin':{
      const u=me();if(!u)return openModal('login');
      if(!db.settings.checkinOpen){toast('지금은 출석체크가 닫혀 있어요');return;}
      if(stats(u.id).todayDone)return;
      window._justStamped=true;
      setDoc(doc(fs,'attendance',u.id),{days:{[today()]:true}},{merge:true})
        .then(()=>toast('오늘 출석이 기록됐어요'))
        .catch(e=>{console.error(e);window._justStamped=false;toast('출석을 기록하지 못했어요. 출석체크가 열려 있는지, 휴대폰 날짜가 맞는지 확인해 주세요');});
      break;
    }
    case'delNotice':askConfirm('이 공지를 삭제할까요?',()=>{deleteDoc(doc(fs,'notices',id)).then(()=>toast('공지를 삭제했습니다')).catch(fail);},'삭제','공지 삭제');break;
    case'pinNotice':{const n=db.notices.find(n=>n.id===id);if(n)updateDoc(doc(fs,'notices',id),{pinned:!n.pinned}).catch(fail);break;}
    case'delMat':askConfirm('이 자료를 삭제할까요?',()=>{
      const b=writeBatch(fs);b.delete(doc(fs,'materials',id));b.delete(doc(fs,'materialLinks',id));
      b.commit().then(()=>toast('자료를 삭제했습니다')).catch(fail);},'삭제','자료 삭제');break;
    case'delUser':askConfirm(`"${id}" 회원의 정보와 출석 기록을 모두 삭제합니다. 되돌릴 수 없습니다.`,()=>{
      const b=writeBatch(fs);b.delete(doc(fs,'users',id));b.delete(doc(fs,'attendance',id));
      b.commit().then(()=>toast('회원을 삭제했습니다')).catch(fail);},'삭제','회원 삭제');break;
    case'export':{
      const out={users:db.users.map(u=>({id:u.id,name:u.name,joined:u.joined})),notices:db.notices,
        materials:db.materials.map(m=>({...m,url:linkCache[m.id]||''})),attendance:db.attendance,settings:db.settings};
      const blob=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
      const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`study-backup-${today()}.json`;
      document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1000);break;
    }
  }
});

document.addEventListener('change',e=>{
  if(e.target.id==='swCheckin'){
    const open=e.target.checked;
    setDoc(doc(fs,'settings','main'),{checkinOpen:open},{merge:true})
      .then(()=>toast(open?'출석체크를 열었습니다':'출석체크를 닫았습니다'))
      .catch(err=>{fail(err);render();});
  }
  if(e.target.id==='importFile'){
    const file=e.target.files[0];if(!file)return;e.target.value='';
    const r=new FileReader();
    r.onload=()=>{
      try{
        const d=JSON.parse(r.result);
        if(!Array.isArray(d.users)||!Array.isArray(d.notices)||!Array.isArray(d.materials)||!d.settings||!d.attendance)throw 0;
        askConfirm('백업 파일 내용을 서버에 덮어씁니다. 같은 항목은 백업 내용으로 바뀌고, 백업에 없는 항목은 그대로 남습니다.',
          ()=>importBackup(d).then(()=>toast('백업에서 복원했습니다')).catch(fail),'복원','백업 복원');
      }catch(err){toast('올바른 백업 파일이 아닙니다');}
    };
    r.readAsText(file);
  }
});

// 예전 버전(기기에 저장하던 버전)의 백업 파일도 그대로 복원됩니다.
async function importBackup(d){
  const ops=[],lc=s=>String(s??'').trim().toLowerCase();
  d.users.forEach(u=>{const id=lc(u.id);if(/^[a-z0-9_]{4,20}$/.test(id)&&id!==ADMIN_ID)
    ops.push([doc(fs,'users',id),{name:String(u.name||id).slice(0,20),joined:String(u.joined||today())}]);});
  Object.entries(d.attendance).forEach(([k,v])=>{const id=lc(k);if(!/^[a-z0-9_]{4,20}$/.test(id))return;
    const list=Array.isArray(v)?v:Object.keys((v&&v.days)||{});const days={};list.forEach(x=>days[String(x)]=true);
    ops.push([doc(fs,'attendance',id),{days}]);});
  d.notices.forEach(n=>ops.push([doc(fs,'notices',String(n.id||uid())),
    {title:String(n.title||''),body:String(n.body||''),date:String(n.date||today()),pinned:!!n.pinned}]));
  d.materials.forEach(m=>{const id=String(m.id||uid());
    ops.push([doc(fs,'materials',id),{title:String(m.title||''),minRate:Math.max(0,Math.min(100,parseInt(m.minRate)||0)),desc:String(m.desc||'')}]);
    const url=safeUrl(m.url||'');if(url)ops.push([doc(fs,'materialLinks',id),{url}]);});
  ops.push([doc(fs,'settings','main'),{checkinOpen:!!d.settings.checkinOpen,totalDays:Math.max(1,Math.min(365,parseInt(d.settings.totalDays)||30))}]);
  for(let i=0;i<ops.length;i+=400){const b=writeBatch(fs);ops.slice(i,i+400).forEach(([r,v])=>b.set(r,v));await b.commit();}
}

function resetForm(box){box.querySelectorAll('input,textarea').forEach(i=>{if(i.type==='checkbox')i.checked=i.defaultChecked;else i.value=i.defaultValue;});}
async function handleForm(fid){
  const box=document.getElementById(fid);if(!box||busy)return;const d=collect(box);
  busy=true;
  try{
    if(fid==='fTotal'){
      const n=parseInt(d.total);if(!(n>=1&&n<=365))return toast('1~365 사이로 입력하세요');
      await setDoc(doc(fs,'settings','main'),{totalDays:n},{merge:true});toast('전체 스터디 일수를 저장했습니다');
    }else if(fid==='fNotice'){
      if(!d.title.trim()||!d.body.trim())return toast('제목과 내용을 입력하세요');
      await setDoc(doc(collection(fs,'notices')),{title:d.title.trim(),body:d.body,date:today(),pinned:!!d.pinned});
      resetForm(box);toast('공지를 등록했습니다');
    }else if(fid==='fMat'){
      if(!d.title.trim())return toast('자료 제목을 입력하세요');
      const url=safeUrl(d.url.trim());if(!url)return toast('http:// 또는 https://로 시작하는 링크를 입력하세요');
      const mr=Math.max(0,Math.min(100,parseInt(d.minRate)||0));
      const ref=doc(collection(fs,'materials')),b=writeBatch(fs);
      b.set(ref,{title:d.title.trim(),minRate:mr,desc:(d.desc||'').trim()});
      b.set(doc(fs,'materialLinks',ref.id),{url});
      await b.commit();resetForm(box);toast('자료를 등록했습니다');
    }else if(fid==='fAdminPw'){
      if((d.next||'').length<6)return toast('새 비밀번호는 6자 이상이어야 합니다');
      try{await reauthenticateWithCredential(auth.currentUser,EmailAuthProvider.credential(auth.currentUser.email,d.cur||''));}
      catch(e){return toast(e.code==='auth/too-many-requests'?'시도가 너무 많아요. 잠시 후 다시 해 주세요':'현재 비밀번호가 맞지 않습니다');}
      await updatePassword(auth.currentUser,d.next);resetForm(box);toast('관리자 비밀번호를 변경했습니다');
    }
  }catch(e){fail(e);}
  finally{busy=false;}
}

render();
</script>
